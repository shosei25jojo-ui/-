<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1320">
<meta name="mobile-web-app-capable" content="yes">
<title>建築鬼ごっこ 3D</title>
<style>
  :root { --ui-bg: rgba(10, 16, 28, 0.66); }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d1320; color: #fff;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  }
  #view, #view canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- HUD ---------- */
  .hud { display: none; pointer-events: none; }
  #topbar { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; }
  .pill { background: var(--ui-bg); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 15px; white-space: nowrap;
          border: 1px solid rgba(255,255,255,.14); }
  #phase.day { color: #ffe27a; } #phase.night { color: #9fc4ff; }
  #timer { font-variant-numeric: tabular-nums; min-width: 46px; text-align: center; }
  #status { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: calc(env(safe-area-inset-left) + 8px);
            background: var(--ui-bg); border-radius: 12px; padding: 7px 10px; font-size: 13px; font-weight: 700;
            border: 1px solid rgba(255,255,255,.14); display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
  #status .row { display: flex; gap: 10px; align-items: center; }
  .wood { color: #e9b37a; } .stone { color: #d3dae3; } .fruit { color: #ff6b6b; letter-spacing: 2px; }
  .bar { width: 100px; height: 7px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #4ee08a, #b8f56b); }
  #minimap { position: fixed; top: calc(env(safe-area-inset-top) + 6px); right: calc(env(safe-area-inset-right) + 8px);
             width: 120px; height: 120px; border-radius: 10px; border: 2px solid rgba(255,255,255,.35); background: #000; }

  #telop { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 46px); transform: translateX(-50%);
           background: linear-gradient(90deg, rgba(190,40,40,0), rgba(190,40,40,.92) 15%, rgba(190,40,40,.92) 85%, rgba(190,40,40,0));
           font-weight: 800; font-size: 17px; padding: 7px 44px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .3s;
           text-shadow: 0 2px 3px rgba(0,0,0,.5); }
  #telop.show { opacity: 1; }
  #telop.blue { background: linear-gradient(90deg, rgba(40,70,170,0), rgba(40,70,170,.92) 15%, rgba(40,70,170,.92) 85%, rgba(40,70,170,0)); }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translateX(-50%);
           background: rgba(0,0,0,.7); padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 700;
           opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }

  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); font-weight: 900; font-size: 15px; white-space: nowrap;
         text-shadow: 0 0 3px #000, 0 0 3px #000, 0 1px 2px #000; text-align: center; }
  .lbl .tb { width: 40px; height: 5px; background: rgba(0,0,0,.6); border-radius: 3px; margin: 2px auto 0; overflow: hidden; }
  .lbl .tb > div { height: 100%; background: #7CFC9A; }

  /* ---------- スティック・ボタン ---------- */
  #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
         background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.45); pointer-events: none; opacity: .5; }
  #joy.active { opacity: .95; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
          background: rgba(255,255,255,.75); }
  #buttons { position: fixed; right: calc(env(safe-area-inset-right) + 14px); bottom: calc(env(safe-area-inset-bottom) + 14px);
             width: 236px; height: 176px; }
  .btn { position: absolute; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-weight: 800; color: #fff; border: 3px solid rgba(255,255,255,.55); box-shadow: 0 4px 10px rgba(0,0,0,.4);
         touch-action: none; text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: auto; font-size: 15px; }
  .btn small { font-size: 10px; opacity: .92; }
  .btn.pressed { transform: scale(.92); filter: brightness(1.25); }
  .btn.on { box-shadow: 0 0 0 4px #ffd34d, 0 4px 10px rgba(0,0,0,.4); }
  #bHit    { width: 86px; height: 86px; right: 0; bottom: 0; background: #c43c3c; font-size: 17px; }
  #bJump   { width: 72px; height: 72px; right: 98px; bottom: 0; background: #2d7dd2; }
  #bBuild  { width: 72px; height: 72px; right: 4px; bottom: 98px; background: #b06d2c; }
  #bPick   { width: 66px; height: 66px; right: 98px; bottom: 86px; background: #2f9a5b; }
  #bAttack { width: 100px; height: 100px; right: 0; bottom: 0; background: #8d2bb3; font-size: 17px; }
  #buttons.oni #bJump { right: 112px; }
  #bUp, #bDown { width: 58px; height: 50px; right: 112px; background: #2f8f7a; border-radius: 14px; font-size: 13px; }
  #bUp { bottom: 58px; } #bDown { bottom: 0; }
  #bView { position: fixed; top: calc(env(safe-area-inset-top) + 8px); right: calc(env(safe-area-inset-right) + 138px);
           width: 54px; height: 54px; background: #44506a; font-size: 20px; }
  #cross { position: fixed; left: 50%; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; pointer-events: none; }
  #cross::before, #cross::after { content: ''; position: absolute; background: rgba(255,255,255,.9); box-shadow: 0 0 2px #000, 0 0 1px #000; }
  #cross::before { left: 11px; top: 0; width: 2px; height: 24px; }
  #cross::after { top: 11px; left: 0; height: 2px; width: 24px; }
  #bBuild .ring { position: absolute; inset: -7px; border-radius: 50%; border: 4px solid transparent; }

  /* ---------- 画面 ---------- */
  #screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; padding: 16px; box-sizing: border-box; text-align: center;
            background: radial-gradient(ellipse at 50% 30%, #2b3d5c 0%, #121a2a 75%); z-index: 10; }
  #screen.hidden { display: none; }
  #screen h1 { font-size: 44px; margin: 0; line-height: 1.1; letter-spacing: 2px; color: #ffd34d;
               text-shadow: 0 4px 0 #b3471f, 0 8px 18px rgba(0,0,0,.5); }
  #screen h1 small { display: block; font-size: 20px; letter-spacing: 6px; color: #fff; text-shadow: none; margin-top: 6px; }
  #screen h2 { margin: 0; font-size: 22px; }
  #screen p { margin: 0; color: #c8d3e6; font-size: 14px; line-height: 1.6; }
  .row2 { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .choice { width: min(280px, 42vw); padding: 14px 12px; border-radius: 16px; border: 3px solid rgba(255,255,255,.35);
            font-size: 22px; font-weight: 800; color: #fff; display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; font-family: inherit; }
  .choice span { font-size: 12px; font-weight: 600; opacity: .92; line-height: 1.5; }
  .choice:active { transform: scale(.97); }
  .c-human { background: linear-gradient(160deg, #3b7de0, #2554a8); }
  .c-oni   { background: linear-gradient(160deg, #d9483b, #962a20); }
  .c-carn  { background: linear-gradient(160deg, #e0832f, #a3521a); }
  .c-mons  { background: linear-gradient(160deg, #9b46c9, #5f2486); }
  .c-plain { background: linear-gradient(160deg, #3a4a66, #263247); font-size: 16px; padding: 10px; }
  .tap { animation: blink 1.2s infinite; font-weight: 800; font-size: 18px; color: #fff !important; margin-top: 10px !important; }
  @keyframes blink { 50% { opacity: .25; } }
  .result-big { font-size: 34px; font-weight: 900; } .win { color: #ffd34d; } .lose { color: #8fa3c4; }
  .stats { background: rgba(0,0,0,.3); border-radius: 12px; padding: 8px 18px; font-size: 14px; line-height: 1.7; }
  #rotate { position: fixed; inset: 0; z-index: 50; background: #0d1320; display: none; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; font-size: 22px; font-weight: 800; text-align: center; }
  #rotate .icon { font-size: 64px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  /* ---------- 鬼の待機ルーム ---------- */
  #wait { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center; gap: 8px;
          padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; box-sizing: border-box; overflow-y: auto;
          background: radial-gradient(ellipse at 50% 0%, #4a1f3a 0%, #170d1c 70%); }
  #wait .wtop { display: flex; gap: 14px; align-items: center; }
  #wait h2 { margin: 0; font-size: 22px; color: #ff8a8a; }
  #wait .note { margin: 0; font-size: 12px; color: #d9c2d0; }
  #wait .wcols { display: flex; gap: 10px; width: 100%; max-width: 900px; justify-content: center; }
  #wait .wcol { flex: 1; background: rgba(0,0,0,.3); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #wait h3 { margin: 0 0 2px; font-size: 14px; color: #ffd34d; }
  .wbtn { border-radius: 12px; border: 2px solid rgba(255,255,255,.25); background: #2c2238; color: #fff; padding: 7px 8px;
          font-family: inherit; font-weight: 800; font-size: 15px; text-align: left; display: flex; flex-direction: column; gap: 1px; }
  .wbtn span { font-size: 11px; font-weight: 600; opacity: .85; }
  .wbtn.sel { border-color: #ffd34d; background: #5a2f4a; box-shadow: 0 0 0 2px #ffd34d inset; }
  .wbtn:active { transform: scale(.97); }
  .wbtn:disabled { opacity: .35; filter: grayscale(1); }
  .wbtn .who { font-size: 11px; color: #9fd0ff; }
  #alert { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 8; pointer-events: none; display: none;
           font-size: 44px; font-weight: 900; color: #ff3b3b; text-shadow: 0 0 12px #000, 0 0 4px #000; animation: alertBlink .35s infinite; white-space: nowrap; }
  @keyframes alertBlink { 50% { opacity: .35; transform: translate(-50%, -50%) scale(1.06); } }
  #wait .mates { font-size: 12px; color: #d9c2d0; }
  #waitTime { color: #ffd34d; }
  #loadErr { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; z-index: 60; background: #0d1320; }
</style>
</head>
<body>
<div id="view"></div>
<div id="labels"></div>

<div id="topbar" class="hud">
  <div class="pill" id="phase">☀ 昼</div>
  <div class="pill" id="timer">1:30</div>
  <div class="pill" id="alive">人 6/6</div>
</div>
<div id="status" class="hud"></div>
<canvas id="minimap" class="hud"></canvas>
<div id="telop"></div>
<div id="toast"></div>

<div id="cross" class="hud"></div>
<div class="btn hud" id="bView">👁<small id="viewLabel">主観</small></div>
<div id="joy" class="hud"><div id="knob"></div></div>
<div id="buttons" class="hud">
  <div class="btn" id="bPick">拾う</div>
  <div class="btn" id="bBuild">建てる<small id="buildLabel">足場</small><div class="ring" id="buildRing"></div></div>
  <div class="btn" id="bJump">ジャンプ</div>
  <div class="btn" id="bHit">叩く</div>
  <div class="btn" id="bAttack">攻撃<small id="atkLabel">タッチ/破壊</small></div>
  <div class="btn" id="bUp" style="display:none">▲上昇</div>
  <div class="btn" id="bDown" style="display:none">▼下降</div>
</div>

<div id="screen"></div>
<div id="wait"></div>
<div id="alert">⚠ 鬼が来た！</div>
<div id="rotate"><div class="icon">📱</div>スマホを横にしてください</div>
<div id="loadErr">3D描画ライブラリ(Three.js)を読み込めませんでした。<br>インターネット接続を確認して再読み込みしてください。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// =====================================================================
// 調整用の定数
// =====================================================================
const DAY_TIME = 90;          // 昼フェーズの長さ(秒)
const NIGHT_TIME = 120;       // 夜フェーズの長さ(秒)
const FREEZE_LIMIT = 30;      // 凍結してから脱落するまでの秒数
const MAX_FREEZE_COUNT = 3;   // この回数凍結した人は、次のタッチで即脱落
const HUMAN_COUNT = 6;        // 人の数
const ONI_COUNT = 2;          // 鬼の数
const FIELD_SIZE = 60;        // フィールドの大きさ(マス)

// ---- ラウンド・部屋 ----
const NIGHT_COUNT = 3;        // 昼→夜を1ラウンドとして何回くり返すか
const ROOM_COUNT = 2;         // 部屋の数(最大4。STEP1は2)
const RESCUE_OPEN = 30;       // 夜開始から、鬼のいない部屋の通路が開くまで(秒)
const HUMAN_ROOM_CAP = 4;     // 1部屋に入れる人の定員
const ONI_ROOM_CAP = 2;       // 鬼が分かれるときの1部屋の定員
const ONI_SPLIT_MIN = 3;      // 鬼がこの数以上なら各自が部屋を選ぶ(未満なら全員で投票)
const ROOM_SELECT_TIME = 10;  // 部屋選択の制限時間(秒)
const ONI_ENTER_DELAY = 2;    // 夜開始から鬼が扉を開けて入ってくるまで(秒)
const ROOM_DEFS = [
  { terrain: 'forest',  name: '森',     icon: '🌲', desc: '木が多く見通しが悪い' },
  { terrain: 'factory', name: '廃工場', icon: '🏭', desc: '狭い通路と壁が多い' },
  { terrain: 'forest',  name: '深い森', icon: '🌳', desc: '木がさらに密集している' },
  { terrain: 'factory', name: '倉庫',   icon: '🏚', desc: '壁に囲まれた小部屋だらけ' },
];
// ---- 鬼の強化(待機ルームで1つ選ぶ) ----
const BOOSTS = {
  speed:  { name: '移動速度アップ', desc: '足が1.2倍速くなる' },
  power:  { name: '破壊力アップ',   desc: '壁・足場へのダメージ2倍' },
  freeze: { name: '凍結時間延長',   desc: '凍らせた人の解凍に2倍の時間がかかる' },
};
const BOOST_SPEED = 1.2, BOOST_POWER = 2, BOOST_THAW = 2;

// ---- 資材(多め) ----
const BOX_COUNT = 130;        // 最初に置かれる箱の数
const BOX_ITEMS = 5;          // 箱1つから出る資材の数
const CHEST_ITEMS = 50;       // 巨大宝箱から出る資材の数
const RAIN_BOXES = 26;        // 資材の雨で降る箱の数
const START_WOOD = 4, START_STONE = 3;
const EVENT_INTERVAL = 30;    // 昼のランダムイベントの間隔(秒)

// ---- 建築 ----
const PARTS = {
  scaffold: { name: '足場', wood: 2, stone: 0, h: 1, hp: 4 },
  wall:     { name: '壁',   wood: 0, stone: 3, h: 2, hp: 8 },
  roof:     { name: '屋根', wood: 2, stone: 2, h: 1, hp: 5, slab: true }, // 薄い板。UFOのビームを防ぐ
};
const PART_ORDER = ['scaffold', 'wall', 'roof'];
const BUILD_REACH = 4;               // 照準から何マス先まで建てられるか
const MAX_STACK = 10;                // 建てられる高さの上限(マス)
const SCAFFOLD_SAFE_TIME = 5;        // 同じ足場にこの秒数いると揺れ始める
const SCAFFOLD_CRUMBLE_TIME = 2;     // 揺れ始めてから崩れるまで
const BUILD_MODE_TIMEOUT = 6;        // 建築プレビューが消えるまでの秒数
const LONG_PRESS = 0.45;             // 長押し判定(秒)

// ---- キャラ ----
const GRAVITY = 22;
const HUMAN_SPEED = 4.2, HUMAN_JUMP = 1.3;  // ジャンプの高さ1.3 → 1段だけ登れる
const HUMAN_R = 0.3, HUMAN_H = 1.6;
const ONI = {
  carnivore: { name: '🐺 肉食動物', speed: 5.0, jump: 0.55, r: 0.42, h: 1.1, dmg: 1 },
  monster:   { name: '👹 モンスター', speed: 3.3, jump: 0.5,  r: 0.55, h: 2.7, dmg: 5 },
  alien:     { name: '🛸 宇宙人',     speed: 2.8, jump: 0,    r: 1.0,  h: 0.9, dmg: 0, fly: true },
};
const ONI_SPEED_MUL = 1.25;          // 鬼全体の移動速度の倍率(全員まとめて速くする)
const HIGH_Y = 0.5;                  // この高さ以上が「高い場所」(高鬼のセーフ)
const MONSTER_REACH = 1.05;          // モンスターがタッチできる高さ
const THAW_TIME = 2, HIT_STUN = 2, HIT_COST = 35, STAMINA_MAX = 100, STAMINA_REGEN = 12, HIT_RANGE = 1.5;
const ONI_ATTACK_RANGE = 1.3, ONI_ATTACK_CD = 0.6;
// ---- 宇宙人(UFO) ----
const BEAM_COOLDOWN = 10;            // ビーム(吸い上げ)のクールタイム(秒)
const BEAM_BREAK_TIME = 1;           // ビームを当て続けて建物を壊す時間(1マスあたり秒。壁は2マスなので2秒)
const UFO_MIN_HEIGHT = 4, UFO_MAX_HEIGHT = 10;
const BEAM_RADIUS = 1.3;             // UFOの真下とみなす範囲
const UFO_STUN = 3;                  // 叩かれたUFOが操作不能になる秒数
const ONI_TYPES = ['carnivore', 'monster', 'alien'];

// ---- 表示 ----
const CAM_DIST = 7.5, CAM_HEIGHT = 4.2, CAM_ROT_SPEED = 0.007;
const MAX_LANTERN_LIGHTS = 3;        // 実際に光らせるランタンの数(軽さ優先)
const SKY_DAY = 0x9ed6ff, SKY_NIGHT = 0x05070f;
const FOG_DAY = [35, 85], FOG_NIGHT = [4, 19];

const N = FIELD_SIZE, TAU = Math.PI * 2;
const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const HUMAN_COLORS = [0x3d8bfd, 0x20c997, 0xffc233, 0xf783ac, 0x9775fa, 0x66d9e8, 0xff922b, 0x94d82d];

// =====================================================================
// ユーティリティ
// =====================================================================
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hdist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const dir2 = (x, z) => { const l = Math.hypot(x, z); return l > 1e-6 ? { x: x / l, z: z / l } : { x: 0, z: 0 }; };
const fmtTime = (t) => { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const $ = (id) => document.getElementById(id);
const idx = (x, z) => z * N + x;
const inField = (x, z) => x >= 0 && z >= 0 && x < N && z < N;
const cellOf = (e) => idx(Math.floor(e.x), Math.floor(e.z));
const cX = (i) => (i % N) + 0.5, cZ = (i) => ((i / N) | 0) + 0.5;
function nearest(list, p, filter) {
  let best = null, bd = Infinity;
  for (const e of list) { if (filter && !filter(e)) continue; const d = hdist(e, p); if (d < bd) { bd = d; best = e; } }
  return best;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }

if (typeof THREE === 'undefined') { $('loadErr').style.display = 'flex'; throw new Error('THREE not loaded'); }

// =====================================================================
// フィールド(グリッド)
// =====================================================================
// obst: 0=なし 1=柵 2=岩 3=木 4=小屋   cols: 各マスに積まれたブロック   heights: 各マスの高さ
const OB_FENCE = 1, OB_ROCK = 2, OB_TREE = 3, OB_HUT = 4, OB_DIV = 5, OB_FWALL = 6, OB_TANK = 7, OB_GATE = 8;
// heights: 地面から続くブロックの上面(歩ける高さ)  clearance: その上の空き(頭上の高さ)  topH: 一番上のブロックの上面
let obst = new Uint8Array(N * N), heights = new Float32Array(N * N), clearance = new Float32Array(N * N), topH = new Float32Array(N * N), cols = [], huts = [];
let vox = [];                        // ボクセル: vox[lv*N*N + i] = そのマスを占めるブロック

// 部屋は縦長の帯。部屋どうしの間は2列の仕切り壁で、通路は2か所
const DIVW = 2;
const ROOM_W = Math.floor((N - 2 - (ROOM_COUNT - 1) * DIVW) / ROOM_COUNT);
const PASSAGES = [Math.round(N * 0.25), Math.round(N * 0.75)].map((c) => [c - 1, c, c + 1]);
let ROOMS = [];
const roomOfX = new Int8Array(N).fill(-1);

      }
      const mine = (p) => roomAt(Math.floor(p.x)) === h.room;
      let t = G.chest && mine(G.chest) && G.chest.y < 0.1 ? G.chest : null;
      if (!t) t = nearest(G.items, h, (it) => !it.magnet && hdist(it, h) < 10 && it.y < h.y + 1.5 && mine(it));
      const box = nearest(G.boxes, h, (b) => !b.opened && b.y <= 0.05 && mine(b));
      if (!t || (box && hdist(box, h) < hdist(t, h) * 0.5)) t = box || t;
      mv = t ? seekPoint(h, t.x, t.z, 1, false) : wander(h, 1);
      if (Math.random() < 0.05) { const near = G.items.some((it) => !it.magnet && hdist(it, h) < 3.5); if (near) doPick(h); }
    }
  } else {
    const onis = activeOnis().filter((o) => sameRoom(o, h)); // 見えるのは同じ部屋の鬼だけ
    let near = null, nd = Infinity;
    for (const o of onis) { const d = hdist(o, h) * (o.stun > 0 ? 1.8 : 1); if (d < nd) { nd = d; near = o; } }
    const here = cellOf(h);
    if (h.standTime > 3.5) { ai.banCell = here; ai.banT = 6; }
    const threats = onis.filter((o) => o.stun <= 0 && hdist(o, h) < 9);
    const danger = (o) => (ONI[o.type].fly ? !coveredFromAbove(h) && hdist(o, h) < 3.5 : canTouch(o, h));
    const safeHere = threats.length > 0 && threats.every((o) => !danger(o)) && h.standTime <= 3.5 &&
                     !threats.some((o) => o.type === 'monster' && hdist(o, h) < 4);
    const minOni = (p) => Math.min(...activeOnis().map((o) => hdist(o, p) * (o.stun > 0 ? 1.8 : 1)));
    // 鬼のいない部屋の人は、通路が開いたら赤いランプの部屋へ救援に行く
    const rescuer = !G.oniRooms.includes(h.room) && G.rescueOpened;
    const ally = nearest(G.humans, h, (a) => a.state === 'frozen' && !a.captor && (rescuer ? true : hdist(a, h) < 14 && sameRoom(a, h)) && minOni(a) > (rescuer ? 8 : 7));
    const away = roomAt(Math.floor(h.x)) !== h.room; // 救援で他の部屋に来ている
    // 仲間を閉じ込めたUFOがビームの充電中なら、下にもぐってジャンプして叩く
    const ufo = activeOnis().find((o) => ONI[o.type].fly && o.captives.length && o.beamCd > 1.5 && o.stun <= 0 && sameRoom(o, h) && hdist(o, h) < 8);

      h.yaw = Math.atan2(ufo.x - h.x, ufo.z - h.z);

    } else if (safeHere) {

    } else if (away && nd < 7) { // 救援中に鬼が近づいたら自分の部屋へ逃げ帰る
      mv = seekPoint(h, ROOMS[h.room].home.x + 0.5, ROOMS[h.room].home.z + 0.5, 1, false);
    } else if (ally && nd > (rescuer ? 7 : 6)) {
      mv = hdist(ally, h) > h.r * 2 + 0.25 ? seekPoint(h, ally.x, ally.z, 1, false) : { x: 0, z: 0 };
    } else if (nd < 10) {
      let r = null;
      if (near.type === 'carnivore' && nd > 1.4)
        r = seekPred(h, 'high', (i) => heights[i] >= 1 && !obst[i] && !isCrumbling(i) && !(ai.banT > 0 && i === ai.banCell), 1, 12);
      else if (ONI[near.type].fly && !coveredFromAbove(h)) // UFOからは屋根の下へ逃げこむ
        r = seekPred(h, 'cover', isCoverCell, 1, 16);
      mv = r ? r.dir : fleeDir(h);
      if (near.stun <= 0 && h.stamina >= HIT_COST && ai.hitCd <= 0 && canHit(h, near)) {
        h.yaw = Math.atan2(near.x - h.x, near.z - h.z); doHit(h); ai.hitCd = 1.2;
      }
    } else if (roomAt(Math.floor(h.x)) !== h.room) { // 救援が終わったら自分の部屋へ戻る
      mv = seekPoint(h, ROOMS[h.room].home.x + 0.5, ROOMS[h.room].home.z + 0.5, 1, false);
    } else {
      mv = wander(h, 1, 0.5);
    }
  }
  if (ai.unstickT > 0) { ai.unstickT -= dt; mv = { x: Math.sin(ai.unstickA), z: Math.cos(ai.unstickA) }; }
  h.mv = mv;
}
// UFO: 屋根の下にいない人の真上へ飛んでいき、ビームで吸い上げる
function ufoAI(o) {
  const ai = o.ai; ai.wanderT -= 1 / 60;
  let mv = { x: 0, z: 0 };
  if (o.stun > 0) { o.mv = mv; return; }
  const inRoom = G.humans.filter((h) => h.state === 'ok' && roomAt(Math.floor(h.x)) === o.room);
  let t = nearest(inRoom, o, (h) => !coveredFromAbove(h)), breaking = false;
  if (!t) { t = nearest(inRoom, o); breaking = true; } // 全員が屋根の下 → 屋根をビームで壊す
  o.beamHold = false;
  if (t) {
    const d = hdist(t, o);
    if (d > 0.35) mv = dir2(t.x - o.x, t.z - o.z);
    if (!breaking) {
      o.altTarget = clamp(t.y + (t.y > 1.5 ? 5.5 : 4.2), UFO_MIN_HEIGHT, UFO_MAX_HEIGHT); // 高い所の人には叩かれないよう高めに
      if (d < 0.9 && o.beamCd <= 0) doBeam(o, true);
    } else {
      const top = topH[cellOf(t)];
      o.altTarget = clamp(top + 2.5, UFO_MIN_HEIGHT, UFO_MAX_HEIGHT);
      if (d < 0.6 && o.y >= top - 0.05) o.beamHold = true;
    }
  } else {
    if (ai.wander < 0 || ai.wanderT <= 0 || hdist(o, { x: cX(ai.wander), z: cZ(ai.wander) }) < 1) { ai.wander = randomFreeCell(2, inRoomCell(o.room)); ai.wanderT = rand(4, 8); }
    mv = dir2(cX(ai.wander) - o.x, cZ(ai.wander) - o.z); mv.x *= 0.6; mv.z *= 0.6;
    o.altTarget = 6;
  }
  o.mv = mv;
}
function oniAI(o, dt) {
  if (ONI[o.type].fly) { ufoAI(o); return; }
  const ai = o.ai; ai.wanderT -= dt;
  let mv = { x: 0, z: 0 };
  if (o.stun > 0) { o.mv = mv; return; }
  {
    const ok = G.humans.filter((h) => h.state === 'ok' && roomAt(Math.floor(h.x)) === o.room); // 自分の部屋の人だけ
    let target = nearest(ok, o, (h) => canTouch(o, h)), waiting = false;
    if (!target) { target = nearest(ok, o); waiting = true; }
    if (!target) {
      const fr = nearest(G.humans, o, (h) => h.state === 'frozen' && roomAt(Math.floor(h.x)) === o.room);
      mv = fr && hdist(fr, o) > 3 ? seekPoint(o, fr.x, fr.z, 0, false) : wander(o, 0, 0.4);
    } else {
      const d = hdist(o, target);
      if (target.y >= HIGH_Y && d < 1.9) { // 足場の上の人: 足場を壊す(モンスターは1〜2回、肉食動物は少しずつ)
        o.yaw = Math.atan2(target.x - o.x, target.z - o.z);
        if (o.atkCd <= 0) { o.atkCd = ONI_ATTACK_CD; o.swing = 0.3; attackCell(o, cellOf(target)); }
      } else if (waiting && d < 2.6 && o.type === 'carnivore') { // 肉食動物は下で待ち伏せ(モンスターは近づいて壊す)
        o.yaw = Math.atan2(target.x - o.x, target.z - o.z);
      } else {
        mv = seekPoint(o, target.x, target.z, 0, true);
      }
      if (!waiting && d < ONI_ATTACK_RANGE + o.r) { o.yaw = Math.atan2(target.x - o.x, target.z - o.z); doOniAttack(o); }
      // 経路上のブロックを壊して進む
      if (ai.pBreak && ai.pNext >= 0 && cols[ai.pNext].length && Math.hypot(cX(ai.pNext) - o.x, cZ(ai.pNext) - o.z) < 1.25 && o.atkCd <= 0) {
        o.yaw = Math.atan2(cX(ai.pNext) - o.x, cZ(ai.pNext) - o.z);
        o.atkCd = ONI_ATTACK_CD; o.swing = 0.3; attackCell(o, ai.pNext);
      }
    }
  }
  if (ai.unstickT > 0) { ai.unstickT -= dt; mv = { x: Math.sin(ai.unstickA), z: Math.cos(ai.unstickA) }; }
  o.mv = mv;
}
function checkStuck(e, dt) {
  const ai = e.ai, wants = Math.hypot(e.mv.x, e.mv.z) > 0.3, moved = Math.hypot(e.x - ai.lastX, e.z - ai.lastZ);
  ai.lastX = e.x; ai.lastZ = e.z;
  if (wants && moved < 0.01) ai.stuckT += dt; else ai.stuckT = Math.max(0, ai.stuckT - dt);
  if (ai.stuckT > 0.7) {
    ai.stuckT = 0; ai.unstickT = 0.5; ai.unstickA = rand(0, TAU); ai.pathT = 0; ai.qT = 0;
    if (e.kind === 'oni' && G.phase === 'night' && e.entered) doOniAttack(e);
    else if (e.kind === 'human') jump(e);
  }
}

// =====================================================================
// 更新
// =====================================================================
function update(dt) {
  // 昼夜の切り替え(3秒かけて暗くする)
  const target = G.phase === 'night' ? 1 : 0;
  if (nightK !== target) { nightK = clamp(nightK + (target ? dt : -dt) / 3, 0, 1); applyLighting(); }
  if (G.phase === 'select') { updateSelect(dt); return; }
  G.timeLeft -= dt;
  if (G.phase === 'day') {
    G.dayElapsed += dt;
    if (G.player.kind === 'oni') { const w = $('waitTime'); if (w) w.textContent = '夜まで ' + fmtTime(G.timeLeft); }
    if (G.dayElapsed >= G.nextEvent && G.nextEvent < DAY_TIME) { triggerEvent(); G.nextEvent += EVENT_INTERVAL; }
    if (G.rain) { G.rain.t -= dt; if (G.rain.t <= 0) { world.remove(G.rain.mesh); G.rain = null; } }
    if (G.timeLeft <= 0) { startNight(); return; }
  } else {
    G.nightT += dt;
    // 鬼のいない部屋があれば、RESCUE_OPEN秒後に通路が開く
    if (!G.rescueOpened && G.nightT >= RESCUE_OPEN && G.oniRooms.length < ROOM_COUNT) {
      G.rescueOpened = true; setGates(false);
      if (G.player.kind === 'human' && G.player.state !== 'out')
        telop(G.oniRooms.includes(G.player.room) ? '🚪 通路が開いた！ 仲間が救援に来られる' : '🚪 通路が開いた！ 赤いランプの部屋へ救援に行ける', '');
    }
    if (G.timeLeft <= 0) { endNight(); return; }
  }

  // 建てるボタンの長押し
  if (buildPress.down && !buildPress.switched) {
    buildPress.t += dt;
    $('buildRing').style.borderColor = `rgba(255,255,255,${clamp(buildPress.t / LONG_PRESS, 0, 1)})`;
    if (buildPress.t >= LONG_PRESS) { buildPress.switched = true; switchPart(); $('buildRing').style.borderColor = 'transparent'; }
  }
  if (G.buildMode) { G.buildIdle += dt; if (G.buildIdle > BUILD_MODE_TIMEOUT || !canAct()) G.buildMode = false; }

  // --- 人 ---
  for (const h of G.humans) {
    if (h.state === 'out') continue;
    h.stamina = Math.min(STAMINA_MAX, h.stamina + STAMINA_REGEN * dt);
    h.swing = Math.max(0, h.swing - dt); h.safeFx -= dt;
    if (h.state === 'ok') {
      if (h.isPlayer) h.mv = playerMove(); else { h.ai.pathT -= dt; h.ai.qT -= dt; humanAI(h, dt); }
      const m = Math.min(1, Math.hypot(h.mv.x, h.mv.z));
      if (m > 0.05) { h.yaw = Math.atan2(h.mv.x, h.mv.z); moveBody(h, h.mv.x * HUMAN_SPEED * dt, h.mv.z * HUMAN_SPEED * dt); }
      else h.blocked = -Infinity;
      if (!h.isPlayer) { autoJump(h); checkStuck(h, dt); }
    }
    physics(h, dt);
  }
  // --- 鬼 ---
  for (const o of G.onis) {
    if (G.phase !== 'night') continue; // 昼は待機ルーム
    if (!o.entered) { o.enterT -= dt; if (o.enterT <= 0) oniEnters(o); else continue; }
    o.stun = Math.max(0, o.stun - dt); o.atkCd -= dt; o.freezeCd -= dt; o.swing = Math.max(0, o.swing - dt);
    if (o.isPlayer) o.mv = o.stun > 0 ? { x: 0, z: 0 } : playerMove(); else { o.ai.pathT -= dt; o.ai.qT -= dt; oniAI(o, dt); }
    const sp = ONI[o.type].speed * ONI_SPEED_MUL * (o.speedMul || 1);
    const m = Math.hypot(o.mv.x, o.mv.z);
    if (ONI[o.type].fly) { // UFO
      o.beamCd = Math.max(0, o.beamCd - dt); o.beamT = Math.max(0, o.beamT - dt);
      const hold = o.isPlayer ? input.beamHold || input.keys.KeyJ : o.beamHold;
      o.beamOn = !!hold && o.stun <= 0 && o.entered; // ボタンを押している間はビームが出る
      updateBreakBeam(o, hold, dt);
      if (o.stun <= 0) {
        if (o.isPlayer) o.y += ((input.up || input.keys.KeyR ? 1 : 0) - (input.down || input.keys.KeyF ? 1 : 0)) * 3 * dt;
        else o.y += clamp(o.altTarget - o.y, -2 * dt, 2 * dt);
        o.y = clamp(o.y, UFO_MIN_HEIGHT, UFO_MAX_HEIGHT);
        if (m > 0.05) { o.yaw = Math.atan2(o.mv.x, o.mv.z); flyMove(o, o.mv.x * sp * dt, o.mv.z * sp * dt); }
      }
      continue;
    }
    if (o.stun <= 0 && m > 0.05) { o.yaw = Math.atan2(o.mv.x, o.mv.z); moveBody(o, o.mv.x * sp * dt, o.mv.z * sp * dt); o.walkT += dt * sp * m; }
    else o.blocked = -Infinity;
    if (!o.isPlayer && o.stun <= 0) { autoJump(o); checkStuck(o, dt); }
    physics(o, dt);
  }

  // --- 箱 ---
  for (const b of G.boxes) {
    if (b.opened) continue;
    const g = groundAt(b.x, b.z, 0.3, b.y);
    if (b.y > g) { b.vy -= GRAVITY * dt; b.y = Math.max(g, b.y + b.vy * dt); if (b.y === g) { b.vy = 0; burst(b.x, g + 0.1, b.z, 0xd9b98a, 6); } continue; }
    b.y = g;
    for (const h of G.humans) if (h.state === 'ok' && hdist(h, b) < h.r + (b.big ? 0.8 : 0.4) && Math.abs(h.y - b.y) < 0.9) { openBox(b); break; }
  }
  G.boxes = G.boxes.filter((b) => !b.opened);

  // --- 資材 ---
  for (const it of G.items) {
    it.age += dt; it.rot += it.spin * dt;
    if (it.magnet && it.magnet.state === 'ok') {
      const t = it.magnet, d = Math.hypot(t.x - it.x, t.y + 0.6 - it.y, t.z - it.z) || 1, s = Math.min(d, 14 * dt);
      it.x += ((t.x - it.x) / d) * s; it.y += ((t.y + 0.6 - it.y) / d) * s; it.z += ((t.z - it.z) / d) * s;
    } else {
      it.magnet = null;
      it.vy -= GRAVITY * dt;
      const nx = it.x + it.vx * dt, nz = it.z + it.vz * dt;
      if (pointSolid(nx, it.y + 0.05, it.z)) it.vx *= -0.4; else it.x = nx;
      if (pointSolid(it.x, it.y + 0.05, nz)) it.vz *= -0.4; else it.z = nz;
      const py = it.y;
      it.y += it.vy * dt;
      if (it.vy > 0) { const c = ceilingAt(it.x, it.z, 0.05, py + 0.1); if (it.y + 0.1 > c) { it.y = c - 0.1; it.vy = 0; } }
      const g = groundAt(it.x, it.z, 0.05, py);
      if (it.y <= g) { it.y = g; if (it.vy < -2.5) it.vy = -it.vy * 0.42; else it.vy = 0; it.vx *= 0.75; it.vz *= 0.75; it.spin *= 0.8; }
    }
    if (it.age < 0.4) continue;
    for (const h of G.humans) {
      if (h.state !== 'ok' || hdist(h, it) > 0.62 || it.y < h.y - 0.5 || it.y > h.y + 1.8) continue;
      h[it.type]++; it.taken = true;
      if (h.isPlayer) addFx(h.x, h.y + 1.9, h.z, it.type === 'wood' ? '+木材' : '+石', it.type === 'wood' ? '#f0b97a' : '#e3e8ef');
      break;
    }
  }
  G.items = G.items.filter((it) => !it.taken);

  // --- 夜のルール ---
  if (G.phase === 'night') {
    for (const o of activeOnis()) if (!ONI[o.type].fly) for (const h of G.humans)
      if (h.state === 'ok' && hdist(o, h) < o.r + h.r + 0.1 && h.y < o.y + o.hgt && o.y < h.y + h.hgt) tryFreeze(o, h);
    for (const h of G.humans) {
      if (h.state === 'frozen' && h.captor) { // UFOの中
        h.x = h.captor.x; h.z = h.captor.z; h.y = h.captor.y + 0.2;
        h.freezeTimer -= dt;
        if (h.freezeTimer <= 0) { eliminate(h, '脱落…'); h.captor.captives = h.captor.captives.filter((c) => c !== h); h.captor = null; }
      } else if (h.state === 'frozen') {
        const help = G.humans.some((a) => a !== h && a.state === 'ok' && hdist(a, h) < a.r + h.r + 0.35 && Math.abs(a.y - h.y) < 1.2);
        h.thaw = help ? h.thaw + dt : Math.max(0, h.thaw - dt * 0.5);
        if (h.thaw >= (h.thawNeed || THAW_TIME)) {
          h.state = 'ok'; h.thaw = 0; G.stats.thaws++;
          if (G.humans.some((a) => a.state === 'ok' && a !== h && hdist(a, h) < 1.2 && a.room !== roomAt(Math.floor(h.x)))) G.stats.rescues++;
          addFx(h.x, h.y + 2, h.z, '解凍!', '#7CFC9A'); burst(h.x, h.y + 1, h.z, 0x9bffc0, 14);
          if (h.isPlayer) toast('解凍された！');
          continue;
        }
        h.freezeTimer -= dt;
        if (h.freezeTimer <= 0) eliminate(h, '脱落…');
      } else if (h.state === 'ok') {
        // 高鬼: 同じ足場に乗り続けると揺れて崩れる
        const i = cellOf(h), top = cols[i].find((b) => Math.abs(b.y1 - h.y) < 0.05); // 足の下のブロック
        if (h.onGround && top && top.type === 'scaffold') {
          if (h.standBlock === top) h.standTime += dt; else { h.standBlock = top; h.standTime = 0; }
          if (h.standTime >= SCAFFOLD_SAFE_TIME && top.crumble < 0) { top.crumble = SCAFFOLD_CRUMBLE_TIME; addFx(h.x, h.y + 2, h.z, '足場がグラグラ!', '#ffd34d'); }
        } else if (h.onGround) { h.standBlock = null; h.standTime = 0; }
      }
    }
    if (G.humans.every((h) => h.state === 'out')) { endGame('oni'); return; }
  }
  updateLamps();

  // --- ブロック ---
  for (const b of G.blocks.slice()) {
    b.shake = Math.max(0, b.shake - dt);
    b.pop = Math.max(0, b.pop - dt);
    if (b.crumble >= 0) { b.crumble -= dt; if (b.crumble <= 0) { removeBlock(b); settleBlocks(); } }
  }
  // 支えを失って落ちていくブロック
  for (const f of G.falling) {
    f.t += dt; f.vy += GRAVITY * dt; f.mesh.position.y -= f.vy * dt; f.mesh.rotation.z += dt * 2;
    if (f.t > 1.1 || f.mesh.position.y < 0.3) { world.remove(f.mesh); burst(f.mesh.position.x, Math.max(0.3, f.mesh.position.y), f.mesh.position.z, f.color, 8); f.done = true; }
  }
  G.falling = G.falling.filter((f) => !f.done);

  // --- 演出 ---
  for (const p of G.parts) { p.t += dt; p.vy -= GRAVITY * 0.5 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; }
  G.parts = G.parts.filter((p) => p.t < p.life);
  for (const f of G.fx) f.t += dt;
  G.fx = G.fx.filter((f) => { if (f.t > 1.1) { f.el.remove(); return false; } return true; });

}

// 救援ランプ: 凍結した人がいる部屋の扉の上が赤く光る
function updateLamps() {
  ROOMS.forEach((r, k) => {
    const on = G.phase === 'night' && G.humans.some((h) => h.state === 'frozen' && roomAt(Math.floor(h.x)) === k);
    const L = G3.lamps[k];
    if (on && !L.on && G.player.kind === 'human' && G.player.state !== 'out' && roomAt(Math.floor(G.player.x)) !== k)
      toast(`🚨 ${r.icon}${r.name}の扉のランプが赤く光った！`);
    L.on = on;
  });
}

// 警告音と「鬼が来た！」
let actx = null;
function initAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.resume) actx.resume(); } catch (_) {} }
function showAlert() {
  const el = $('alert'); el.style.display = 'block';
  clearTimeout(showAlert.t); showAlert.t = setTimeout(() => (el.style.display = 'none'), 2600);
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (_) {}
  if (!actx) return;
  const t0 = actx.currentTime;
  for (let i = 0; i < 6; i++) {

// =====================================================================
// 見た目の同期・描画

function syncVisuals(time) {
  // 人
  for (const h of G.humans) {
    const m = h.mesh;
    if (h.state === 'out') { m.g.visible = false; continue; }
    // 鬼は自分の部屋に入って初めて、そこにいる人が見える
    m.g.visible = !h.captor && !(G.player.kind === 'oni' && (G.phase !== 'night' || roomAt(Math.floor(h.x)) !== G.player.room));
    m.g.position.set(h.x, h.y, h.z); m.g.rotation.y = h.yaw;
    m.ice.visible = h.state === 'frozen';
    m.stick.visible = h.swing > 0; m.stick.rotation.y = h.swing > 0 ? (h.swing / 0.3 - 0.5) * 2.4 : 0;
    const bob = h.state === 'ok' && h.onGround && Math.hypot(h.mv.x, h.mv.z) > 0.1 ? Math.abs(Math.sin(time / 90)) * 0.06 : 0;
    m.g.position.y += bob;
  }
  // 鬼
  for (const o of G.onis) {
    const m = o.mesh;
    // 人には、自分と同じ部屋にいる鬼だけが見える(どの部屋を選んだかは知らされない)
    m.g.visible = G.phase === 'night' && o.entered && (G.player.kind === 'oni' || sameRoom(o, focusOf()));
    m.g.position.set(o.x, o.y, o.z); m.g.rotation.y = o.yaw;
    m.parts.rotation.x = o.swing > 0 ? Math.sin((o.swing / 0.3) * Math.PI) * 0.35 : 0;
    const legs = m.g.userData.legs, sw = Math.sin(o.walkT * 3) * 0.5;
    if (legs) legs.forEach((l, k) => (l.rotation.x = (k % 2 ? sw : -sw) * (k > 1 ? -1 : 1)));
    m.stars.visible = o.stun > 0; m.stars.rotation.y = time / 200;
    if (ONI[o.type].fly) {
      m.parts.rotation.x = 0; m.parts.position.y = Math.sin(time / 300) * 0.08; m.parts.rotation.y = time / 900;
      const beam = m.g.userData.beam, len = Math.max(0.5, o.y - groundAt(o.x, o.z, 0.1, o.y));
      beam.visible = o.beamT > 0 || o.beamOn; beam.scale.set(1, len, 1); beam.position.y = -len / 2 + 0.2;
      m.g.userData.beamMat.color.set(o.beamT > 0 ? 0x9dff8a : o.breakTarget ? 0xff9a3c : 0x7fe8ff); // 吸い上げ=緑 / 破壊=オレンジ / 空振り=水色
      // 常についているサーチライト
      m.g.userData.searchCone.scale.set(1, len, 1); m.g.userData.searchCone.position.y = 0.2;
      m.g.userData.searchDisc.position.y = -len + 0.25;
    }
  }
  // 箱
  let k = 0;
  for (const b of G.boxes) {
    if (b.big) { b.mesh.position.set(b.x, b.y, b.z); continue; }
    _m.compose(_v.set(b.x, b.y + 0.25, b.z), _q.setFromEuler(_e.set(0, b.rot, 0)), _s.set(1, 1, 1)); POOL.crate.setMatrixAt(k++, _m);
    if (k >= 600) break;
  }
  POOL.crate.count = k; POOL.crate.instanceMatrix.needsUpdate = true;
  // 資材
  let kw = 0, ks = 0;
  for (const it of G.items) {
    _m.compose(_v.set(it.x, it.y + 0.09, it.z), _q.setFromEuler(_e.set(0, it.rot, 0)), _s.set(1, 1, 1));
    if (it.type === 'wood') { if (kw < 2500) POOL.wood.setMatrixAt(kw++, _m); } else if (ks < 2500) POOL.stone.setMatrixAt(ks++, _m);
  }
  POOL.wood.count = kw; POOL.stone.count = ks; POOL.wood.instanceMatrix.needsUpdate = POOL.stone.instanceMatrix.needsUpdate = true;
  // 力の実
  for (const f of G.fruits) { f.mesh.position.set(f.x, f.y + Math.sin(f.bob) * 0.1, f.z); f.mesh.rotation.y = f.bob * 0.5; }
  // ブロック
  for (const b of G.blocks) {
    let ox = 0, oz = 0;
    if (b.shake > 0 || b.crumble >= 0) { const a = b.crumble >= 0 ? 0.07 : 0.05; ox = rand(-a, a); oz = rand(-a, a); }
    b.mesh.position.set(cX(b.i) + ox, (b.type === 'roof' ? b.lv + 0.9 : b.lv + b.h / 2) + b.pop * 2, cZ(b.i) + oz);
    b.mesh.visible = !(G.player.kind === 'oni' && roomAt(b.i % N) !== G.player.room); // 鬼には他の部屋の建物は見えない
  }
  // 救援ランプ(点滅)
  if (G3.lamps) G3.lamps.forEach((L) => L.mat.color.set(L.on ? (Math.sin(time / 140) > 0 ? 0xff2020 : 0x8a0e0e) : 0x3a2222));
  // パーティクル
  let kp = 0;
  for (const p of G.parts) {
    const s = 1 - p.t / p.life;
    _m.compose(_v.set(p.x, p.y, p.z), _q.identity(), _s.set(s, s, s)); POOL.part.setMatrixAt(kp, _m); POOL.part.setColorAt(kp, _c.set(p.color)); kp++;
  }
  POOL.part.count = kp; POOL.part.instanceMatrix.needsUpdate = true; if (POOL.part.instanceColor) POOL.part.instanceColor.needsUpdate = true;

  // カメラ(斜め後ろ上から追従)
  let focus = G.player;
  if (focus.kind === 'human' && focus.state === 'out') {
    if (!G.spectate || G.spectate.state === 'out') G.spectate = G.humans.find((h) => h.state !== 'out') || focus;
    focus = G.spectate;
  }

  const fwx = -Math.sin(camYaw), fwz = -Math.cos(camYaw);
  if (camMode === 'first') {
    // 主観: キャラの目の高さ。自分の体は表示しない
    const ey = eyeHeight(focus);
    G.cam.set(focus.x, focus.y + ey, focus.z);
    camera.position.copy(G.cam);
    const cp = Math.cos(camPitch);
    camera.lookAt(G.cam.x + fwx * cp, G.cam.y + Math.sin(camPitch), G.cam.z + fwz * cp);
    focus.mesh.g.visible = false;
    if (focus.kind === 'human' && focus.state === 'ok') focus.yaw = Math.atan2(fwx, fwz);
    else if (focus.kind === 'oni' && focus.stun <= 0) focus.yaw = Math.atan2(fwx, fwz);
  } else {

    // 木や小屋にさえぎられたらカメラを近づける
    let f = 1;
    for (let k = 1; k <= 24; k++) {
      const t = k / 24, px = G.cam.x + Math.sin(camYaw) * CAM_DIST * t, pz = G.cam.z + Math.cos(camYaw) * CAM_DIST * t, py = G.cam.y + CAM_HEIGHT * t;
      if (obstHeightAt(px, pz) > py - 0.3) { f = Math.max(0.25, (k - 1.5) / 24); break; }
    }
    camDistK += (f - camDistK) * (f < camDistK ? 0.4 : 0.08);
    camera.position.set(G.cam.x + Math.sin(camYaw) * CAM_DIST * camDistK, G.cam.y + CAM_HEIGHT * camDistK, G.cam.z + Math.cos(camYaw) * CAM_DIST * camDistK);
    // 照準(画面中央)が自分の少し前の足元を指すように、少し前を見る
    camera.lookAt(G.cam.x + fwx * 3, G.cam.y - 1.1, G.cam.z + fwz * 3);
  }
  camera.updateMatrixWorld();

  // 建築プレビュー(照準の先)
  updateBuildTarget();
  const bt = G.buildTarget;
  if (bt) {
    const part = PARTS[G.player.buildType];
    G3.preview.visible = true; G3.preview.geometry = part.slab ? GEO.slab : part.h === 2 ? GEO.box2 : GEO.box1;
    G3.preview.position.set(bt.x + 0.5, part.slab ? bt.lv + 0.9 : bt.lv + part.h / 2, bt.z + 0.5);
    MAT.preview.color.set(bt.why ? 0xff5a5a : 0x7CFC9A);
  } else G3.preview.visible = false;
  $('bBuild').classList.toggle('on', !!(bt && !bt.why));

  // 鬼のライト: 見えている鬼のうちカメラに近い順にスポットライトを割り当て
  const lit = G.phase === 'night' ? G.onis.filter((o) => o.entered && (o.mesh.g.visible || o === focus)).sort((a, b) => hdist(a, focus) - hdist(b, focus)) : [];
  oniLights.forEach((l, k2) => {
    const o = lit[k2];
    if (!o) { l.intensity = 0; return; }
    l.intensity = 2.6 * nightK;
    if (ONI[o.type].fly) { l.position.set(o.x, o.y, o.z); l.target.position.set(o.x, 0, o.z); l.angle = 0.42; l.distance = UFO_MAX_HEIGHT + 6; }
    else {
      const ep = o.mesh.g.userData.eyePos, fx = Math.sin(o.yaw), fz = Math.cos(o.yaw);
      l.position.set(o.x + fx * ep[2], o.y + ep[1], o.z + fz * ep[2]);
      l.target.position.set(l.position.x + fx * 6, l.position.y - 6 * Math.tan(o.mesh.g.userData.eyeTilt), l.position.z + fz * 6);
      l.angle = 0.38; l.distance = 14;
    }
    l.target.updateMatrixWorld();
  });
  // ランタンの光: カメラに近い人から順に割り当て
  if (nightK > 0) {
    const list = G.humans.filter((h) => h.state !== 'out').sort((a, b) => hdist(a, focus) - hdist(b, focus));
    lanternLights.forEach((l, k2) => {
      const h = list[k2];
      if (h) { h.mesh.lantern.getWorldPosition(l.position); l.visible = true; } else l.position.set(0, -50, 0);
    });
  }
  MAT.lantern.color.set(nightK > 0.3 ? 0xffe9a8 : 0xffd27a);
}

let camDistK = 1;
function eyeHeight(e) {
  if (e.kind === 'human') return 1.45;
  return { carnivore: 0.95, monster: 2.45, alien: 0.75 }[e.type];
}
const OB_HEIGHT = { [OB_FENCE]: 1.2, [OB_ROCK]: 0.9, [OB_TREE]: 3.0, [OB_HUT]: 3.6, [OB_DIV]: 3.2, [OB_FWALL]: 2.6, [OB_TANK]: 2.2, [OB_GATE]: 2.4, 0: 0 };
function obstHeightAt(x, z) {
  const fx = Math.floor(x), fz = Math.floor(z);
  if (!inField(fx, fz)) return 0;
  const i = idx(fx, fz);
  return obst[i] ? OB_HEIGHT[obst[i]] : topH[i];
}

// 頭上の表示(凍結タイマー・文字)
function project(x, y, z) {
  _v.set(x, y, z).project(camera);
  if (_v.z > 1 || _v.z < -1) return null;
  return { x: (_v.x + 1) / 2 * innerWidth, y: (1 - _v.y) / 2 * innerHeight };
}
function updateLabels() {
  const focus = G.player.state === 'out' && G.spectate ? G.spectate : G.player;
  for (const h of G.humans) {
    if (h.state !== 'frozen' || hdist(h, focus) > (G.phase === 'night' ? 16 : 40)) { h.label.style.display = 'none'; continue; }
    const p = project(h.x, h.y + 2.2, h.z);

    h.label.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -100%)`;

    f.el.style.display = 'block'; f.el.style.opacity = String(1 - f.t / 1.1);
    f.el.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -100%)`;
  }
}

  for (const r of ROOMS) { const x = ((r.x0 + r.x1 + 1) / 2) * 4; c.strokeText(r.name, x, N * 2 + 8); c.fillText(r.name, x, N * 2 + 8); }
}
function drawMinimap(time) {

  c.drawImage(miniBase, 0, 0, W, W);
  if (nightK > 0) {
    c.fillStyle = `rgba(5,10,30,${0.55 * nightK})`; c.fillRect(0, 0, W, W);
  }
  const oniView = G.player.kind === 'oni';
  if (oniView) for (const r of ROOMS) if (r.k !== G.player.room) { c.fillStyle = 'rgba(0,0,0,.7)'; c.fillRect(r.x0 * s, 0, (r.x1 - r.x0 + 1) * s, W); }
  for (const b of G.blocks.slice().sort((a, b2) => a.y1 - b2.y1)) if (!(oniView && roomAt(b.i % N) !== G.player.room)) {
    c.fillStyle = b.type === 'wall' ? '#e2e6ea' : b.type === 'roof' ? '#d0553f' : `hsl(30, 60%, ${35 + Math.min(topH[b.i], 6) * 6}%)`;

  const u = W / 120;

  if (G.rain) { c.strokeStyle = '#ffd34d'; c.lineWidth = 1.5 * u; c.beginPath(); c.arc(G.rain.x * s, G.rain.z * s, G.rain.r * s, 0, TAU); c.stroke(); }
  for (const h of G.humans) if (h.state !== 'out' && !(oniView && roomAt(Math.floor(h.x)) !== G.player.room))
    dot(h.x, h.z, (h.isPlayer ? 3.2 : 2.4) * u, h.state === 'frozen' ? '#bdefff' : h.isPlayer ? '#fff' : '#4d9bff');
  if (G.phase === 'night') for (const o of G.onis) if (o.entered && (oniView || sameRoom(o, focusOf()))) dot(o.x, o.z, (o.isPlayer ? 3.4 : 2.8) * u, o.isPlayer ? '#fff' : '#ff3b3b');

  c.moveTo(p.x * s, p.z * s); c.lineTo((p.x + fx * 6) * s, (p.z + fz * 6) * s); c.stroke();
}

  scene_ = 'title'; setupHUD(true);
  showScreen(`<h1>建築鬼ごっこ<small>3D</small></h1>
    <p>昼に資材を集めてブロックを積み、夜は鬼から逃げ切れ！　高鬼 × 氷鬼 × 建築</p>
    <p class="tap">タップしてスタート</p>`);
}
function showSide() {
  scene_ = 'side';
  showScreen(`<h2>陣営をえらぶ</h2>
    <div class="row2">
      <button class="choice c-human" data-act="human">🧑 人<span>部屋を選んで資材を集め、足場を積む。<br>${NIGHT_COUNT}回の夜を1人でも生きのびれば勝ち</span></button>
      <button class="choice c-oni" data-act="oni">👹 鬼<span>昼は待機ルームで種類・部屋・強化を選び、<br>夜に人をタッチして凍らせる。全員脱落で勝ち</span></button>
    </div>`);
}
function renderWait() {
  const p = G.player;
  const split = splitMode();
  const mates = G.onis.filter((o) => o !== p).map((o) => `CPU鬼: ${ONI[o.type].name}（${split ? ROOMS[o.vote].icon + ROOMS[o.vote].name + 'を選択' : '投票済み'}）`).join('<br>');
  const sel = (on) => (on ? ' sel' : '');
  const toNight = G.phase === 'select' ? G.selectT + DAY_TIME : G.timeLeft;
  $('wait').innerHTML = `
    <div class="wtop"><h2>👹 鬼の待機ルーム（第${G.round}夜の準備）</h2><div class="pill" id="waitTime">夜まで ${fmtTime(toNight)}</div></div>
    <p class="note">人たちは部屋に分かれて資材集め・建築中…（各部屋の人数も建築も鬼からは見えない）。夜になったら選んだ部屋の扉から突入！</p>
    <div class="wcols">
      <div class="wcol"><h3>1. 鬼の種類</h3>
        <button class="wbtn${sel(p.type === 'carnivore')}" data-w="type:carnivore">🐺 肉食動物<span>足が速い。ジャンプは低い。高い場所の人にはタッチできない</span></button>
        <button class="wbtn${sel(p.type === 'monster')}" data-w="type:monster">👹 モンスター<span>遅いが壁・足場を1〜2回で壊す。高さ1まで届く</span></button>
        <button class="wbtn${sel(p.type === 'alien')}" data-w="type:alien">🛸 宇宙人<span>UFOで空を飛ぶ(遅め)。真下の人をビームで吸い上げる。屋根の下には届かない</span></button>
      </div>
      <div class="wcol"><h3>2. ${split ? `部屋をえらぶ（定員${ONI_ROOM_CAP}匹）` : '部屋に投票'}</h3>
        ${ROOMS.map((r) => { const full = split && oniPop(r.k, p) >= ONI_ROOM_CAP;
          return `<button class="wbtn${sel(p.vote === r.k)}" data-w="vote:${r.k}" ${full ? 'disabled' : ''}>${r.icon} ${r.name}<span>${r.desc}</span>${split ? `<span class="who">鬼 ${oniPop(r.k, p) + (p.vote === r.k ? 1 : 0)}/${ONI_ROOM_CAP}</span>` : ''}</button>`; }).join('')}
        <div class="mates">${split ? `鬼が${ONI_SPLIT_MIN}匹以上なので各自で部屋を選ぶ` : '鬼全員の投票で1部屋に決定（同数ならランダム）'}</div>
      </div>
      <div class="wcol"><h3>3. 強化を1つ</h3>
        ${Object.entries(BOOSTS).map(([k, b]) => `<button class="wbtn${sel(p.boost === k)}" data-w="boost:${k}">${b.name}<span>${b.desc}</span></button>`).join('')}
      </div>
    </div>
    <div class="mates">${mates}${p.vote === null || !p.boost ? '<br>選ばなかった項目は夜にランダムで決まります' : '<br>✅ 準備完了！ 夜を待とう'}</div>`;
}
// 人の部屋選択画面(早い者勝ち・定員制)
function renderSelect() {
  const p = G.player, out = p.state === 'out';
  const names = (k) => G.humans.filter((h) => h.state !== 'out' && h.pick === k).map((h) => (h.isPlayer ? '★あなた' : h.name)).join(' ');
  const html = `
    <div class="wtop"><h2 style="color:#9fd0ff">🚪 部屋をえらぶ（${G.round}日目）</h2><div class="pill" id="selTime">のこり ${Math.max(0, Math.ceil(G.selectT))}秒</div></div>
    <p class="note">${out ? 'あなたは脱落しています（観戦中）' : `早い者勝ち・各部屋の定員は${HUMAN_ROOM_CAP}人。選ばないと空いている部屋に自動で入ります。資材は持ち越し、建物は部屋に残ります。`}</p>
    <div class="wcols">
      ${ROOMS.map((r) => { const n = roomPop(r.k), full = roomPop(r.k, p) >= HUMAN_ROOM_CAP && p.pick !== r.k;
        return `<div class="wcol"><button class="wbtn${p.pick === r.k ? ' sel' : ''}" data-w="room:${r.k}" ${full || out ? 'disabled' : ''}>
          ${r.icon} ${r.name}${p.room === r.k ? '（前回の部屋）' : ''}<span>${r.desc}</span><span class="who">👥 ${n}/${HUMAN_ROOM_CAP}人 ${full ? '満員' : ''}</span>
          <span class="who">${names(r.k) || '　'}</span></button></div>`; }).join('')}
    </div>`;
  const w = $('wait'); if (w._h !== html) { w.innerHTML = html; w._h = html; }
}
$('wait').addEventListener('click', (e) => {
  const b = e.target.closest('[data-w]'); if (!b || !G || b.disabled) return;
  const [k, v] = b.dataset.w.split(':'), p = G.player;
  if (k === 'room') {
    if (G.phase === 'select' && p.kind === 'human' && p.state !== 'out' && roomPop(+v, p) < HUMAN_ROOM_CAP) p.pick = +v;
    renderSelect(); return;
  }
  if (k === 'vote' && splitMode() && oniPop(+v, p) >= ONI_ROOM_CAP) return;
  if (k === 'type') { // CPU鬼が同じ種類なら、もう一方の種類に変える
    setOniType(p, v); playerOniType = v;
    for (const o of G.onis) if (o !== p && o.type === v) { const others = ONI_TYPES.filter((t) => t !== v); setOniType(o, others[randInt(0, others.length - 1)]); }
  }
  else if (k === 'vote') p.vote = +v;
  else if (k === 'boost') p.boost = v;
  $('wait')._h = '';
  renderWait();
});
function showOniType() {
  scene_ = 'oniType';
  showScreen(`<h2>鬼の種類をえらぶ</h2>
    <div class="row2">
      <button class="choice c-carn" data-act="carnivore">🐺 肉食動物<span>四足歩行で足が速い。ジャンプは低い。<br>建物への攻撃は弱い。高い場所の人にはタッチできない</span></button>
      <button class="choice c-mons" data-act="monster">👹 モンスター<span>大きくて遅い。壁・足場を1〜2回で壊す。<br>高さ1までの人にタッチできる</span></button>
    </div>
    <button class="choice c-plain" data-act="back">← もどる</button>`);
}
$('screen').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'), act = b ? b.dataset.act : '';
  initAudio();
  if (scene_ === 'title') { tryFullscreen(); showSide(); return; }
  if (act === 'human') { playerSide = 'human'; startGame(); }
  else if (act === 'oni') { playerSide = 'oni'; startGame(); } // 鬼の種類は待機ルームで選ぶ
  else if (act === 'carnivore' || act === 'monster') { playerOniType = act; startGame(); }
  else if (act === 'back' || act === 'again') showSide();
  else if (act === 'title') showTitle();
});
function tryFullscreen() {
  try {
    const el = document.documentElement, p = el.requestFullscreen && el.requestFullscreen({ navigationUI: 'hide' });
    if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
  } catch (_) {}
}

// =====================================================================
// 画面サイズ・向き
// =====================================================================
let portrait = false;
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  portrait = innerHeight > innerWidth;
  $('rotate').style.display = portrait ? 'flex' : 'none';
  if (playing()) resetJoy();
}

// ズーム・スクロール・長押しメニューを無効化
['gesturestart', 'gesturechange', 'dblclick', 'contextmenu', 'selectstart'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', (e) => { if (e.touches.length > 1 && !e.target.closest('.btn')) e.preventDefault(); }, { passive: false });

// =====================================================================
// 起動・メインループ
// =====================================================================
init3D();
const cv = renderer.domElement;
cv.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
window.addEventListener('resize', onResize);
onResize();
showTitle();

let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  try {
    if (G && playing() && !portrait) update(dt);
    if (G && (playing() || scene_ === 'result')) {
      syncVisuals(t);
      renderer.render(scene, camera);
      if (playing()) { updateHUD(); updateLabels(); drawMinimap(t); }
    } else {
      renderer.setClearColor(0x0d1320); renderer.clear();
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
