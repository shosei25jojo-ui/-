<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1320">
<meta name="mobile-web-app-capable" content="yes">
<title>建築鬼ごっこ 3D</title>
<style>
  :root { --ui-bg: rgba(10, 16, 28, 0.66); }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0d1320; color: #fff;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  }
  #view, #view canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- HUD ---------- */
  .hud { display: none; pointer-events: none; }
  #topbar { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; }
  .pill { background: var(--ui-bg); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 15px; white-space: nowrap;
          border: 1px solid rgba(255,255,255,.14); }
  #phase.day { color: #ffe27a; } #phase.night { color: #9fc4ff; }
  #timer { font-variant-numeric: tabular-nums; min-width: 46px; text-align: center; }
  #status { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: calc(env(safe-area-inset-left) + 8px);
            background: var(--ui-bg); border-radius: 12px; padding: 7px 10px; font-size: 13px; font-weight: 700;
            border: 1px solid rgba(255,255,255,.14); display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
  #status .row { display: flex; gap: 10px; align-items: center; }
  .wood { color: #e9b37a; } .stone { color: #d3dae3; } .fruit { color: #ff6b6b; letter-spacing: 2px; }
  .bar { width: 100px; height: 7px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #4ee08a, #b8f56b); }
  #minimap { position: fixed; top: calc(env(safe-area-inset-top) + 6px); right: calc(env(safe-area-inset-right) + 8px);
             width: 120px; height: 120px; border-radius: 10px; border: 2px solid rgba(255,255,255,.35); background: #000; }

  #telop { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 46px); transform: translateX(-50%);
           background: linear-gradient(90deg, rgba(190,40,40,0), rgba(190,40,40,.92) 15%, rgba(190,40,40,.92) 85%, rgba(190,40,40,0));
           font-weight: 800; font-size: 17px; padding: 7px 44px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .3s;
           text-shadow: 0 2px 3px rgba(0,0,0,.5); }
  #telop.show { opacity: 1; }
  #telop.blue { background: linear-gradient(90deg, rgba(40,70,170,0), rgba(40,70,170,.92) 15%, rgba(40,70,170,.92) 85%, rgba(40,70,170,0)); }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translateX(-50%);
           background: rgba(0,0,0,.7); padding: 6px 14px; border-radius: 8px; font-size: 14px; font-weight: 700;
           opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }

  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); font-weight: 900; font-size: 15px; white-space: nowrap;
         text-shadow: 0 0 3px #000, 0 0 3px #000, 0 1px 2px #000; text-align: center; }
  .lbl .tb { width: 40px; height: 5px; background: rgba(0,0,0,.6); border-radius: 3px; margin: 2px auto 0; overflow: hidden; }
  .lbl .tb > div { height: 100%; background: #7CFC9A; }

  /* ---------- スティック・ボタン ---------- */
  #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
         background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.45); pointer-events: none; opacity: .5; }
  #joy.active { opacity: .95; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
          background: rgba(255,255,255,.75); }
  #buttons { position: fixed; right: calc(env(safe-area-inset-right) + 14px); bottom: calc(env(safe-area-inset-bottom) + 14px);
             width: 236px; height: 176px; }
  .btn { position: absolute; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-weight: 800; color: #fff; border: 3px solid rgba(255,255,255,.55); box-shadow: 0 4px 10px rgba(0,0,0,.4);
         touch-action: none; text-shadow: 0 1px 2px rgba(0,0,0,.6); pointer-events: auto; font-size: 15px; }
  .btn small { font-size: 10px; opacity: .92; }
  .btn.pressed { transform: scale(.92); filter: brightness(1.25); }
  .btn.on { box-shadow: 0 0 0 4px #ffd34d, 0 4px 10px rgba(0,0,0,.4); }
  #bHit    { width: 86px; height: 86px; right: 0; bottom: 0; background: #c43c3c; font-size: 17px; }
  #bJump   { width: 72px; height: 72px; right: 98px; bottom: 0; background: #2d7dd2; }
  #bBuild  { width: 72px; height: 72px; right: 4px; bottom: 98px; background: #b06d2c; }
  #bPick   { width: 66px; height: 66px; right: 98px; bottom: 86px; background: #2f9a5b; }
  #bAttack { width: 100px; height: 100px; right: 0; bottom: 0; background: #8d2bb3; font-size: 17px; }
  #buttons.oni #bJump { right: 112px; }
  #bBuild .ring { position: absolute; inset: -7px; border-radius: 50%; border: 4px solid transparent; }

  /* ---------- 画面 ---------- */
  #screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; padding: 16px; box-sizing: border-box; text-align: center;
            background: radial-gradient(ellipse at 50% 30%, #2b3d5c 0%, #121a2a 75%); z-index: 10; }
  #screen.hidden { display: none; }
  #screen h1 { font-size: 44px; margin: 0; line-height: 1.1; letter-spacing: 2px; color: #ffd34d;
               text-shadow: 0 4px 0 #b3471f, 0 8px 18px rgba(0,0,0,.5); }
  #screen h1 small { display: block; font-size: 20px; letter-spacing: 6px; color: #fff; text-shadow: none; margin-top: 6px; }
  #screen h2 { margin: 0; font-size: 22px; }
  #screen p { margin: 0; color: #c8d3e6; font-size: 14px; line-height: 1.6; }
  .row2 { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .choice { width: min(280px, 42vw); padding: 14px 12px; border-radius: 16px; border: 3px solid rgba(255,255,255,.35);
            font-size: 22px; font-weight: 800; color: #fff; display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center; font-family: inherit; }
  .choice span { font-size: 12px; font-weight: 600; opacity: .92; line-height: 1.5; }
  .choice:active { transform: scale(.97); }
  .c-human { background: linear-gradient(160deg, #3b7de0, #2554a8); }
  .c-oni   { background: linear-gradient(160deg, #d9483b, #962a20); }
  .c-carn  { background: linear-gradient(160deg, #e0832f, #a3521a); }
  .c-mons  { background: linear-gradient(160deg, #9b46c9, #5f2486); }
  .c-plain { background: linear-gradient(160deg, #3a4a66, #263247); font-size: 16px; padding: 10px; }
  .tap { animation: blink 1.2s infinite; font-weight: 800; font-size: 18px; color: #fff !important; margin-top: 10px !important; }
  @keyframes blink { 50% { opacity: .25; } }
  .result-big { font-size: 34px; font-weight: 900; } .win { color: #ffd34d; } .lose { color: #8fa3c4; }
  .stats { background: rgba(0,0,0,.3); border-radius: 12px; padding: 8px 18px; font-size: 14px; line-height: 1.7; }
  #rotate { position: fixed; inset: 0; z-index: 50; background: #0d1320; display: none; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; font-size: 22px; font-weight: 800; text-align: center; }
  #rotate .icon { font-size: 64px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  /* ---------- 鬼の待機ルーム ---------- */
  #wait { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column; align-items: center; gap: 8px;
          padding: calc(env(safe-area-inset-top) + 10px) 14px 10px; box-sizing: border-box; overflow-y: auto;
          background: radial-gradient(ellipse at 50% 0%, #4a1f3a 0%, #170d1c 70%); }
  #wait .wtop { display: flex; gap: 14px; align-items: center; }
  #wait h2 { margin: 0; font-size: 22px; color: #ff8a8a; }
  #wait .note { margin: 0; font-size: 12px; color: #d9c2d0; }
  #wait .wcols { display: flex; gap: 10px; width: 100%; max-width: 900px; justify-content: center; }
  #wait .wcol { flex: 1; background: rgba(0,0,0,.3); border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #wait h3 { margin: 0 0 2px; font-size: 14px; color: #ffd34d; }
  .wbtn { border-radius: 12px; border: 2px solid rgba(255,255,255,.25); background: #2c2238; color: #fff; padding: 7px 8px;
          font-family: inherit; font-weight: 800; font-size: 15px; text-align: left; display: flex; flex-direction: column; gap: 1px; }
  .wbtn span { font-size: 11px; font-weight: 600; opacity: .85; }
  .wbtn.sel { border-color: #ffd34d; background: #5a2f4a; box-shadow: 0 0 0 2px #ffd34d inset; }
  .wbtn:active { transform: scale(.97); }
  #wait .mates { font-size: 12px; color: #d9c2d0; }
  #waitTime { color: #ffd34d; }
  #loadErr { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; z-index: 60; background: #0d1320; }
</style>
</head>
<body>
<div id="view"></div>
<div id="labels"></div>

<div id="topbar" class="hud">
  <div class="pill" id="phase">☀ 昼</div>
  <div class="pill" id="timer">1:30</div>
  <div class="pill" id="alive">人 6/6</div>
</div>
<div id="status" class="hud"></div>
<canvas id="minimap" class="hud"></canvas>
<div id="telop"></div>
<div id="toast"></div>

<div id="joy" class="hud"><div id="knob"></div></div>
<div id="buttons" class="hud">
  <div class="btn" id="bPick">拾う</div>
  <div class="btn" id="bBuild">建てる<small id="buildLabel">足場</small><div class="ring" id="buildRing"></div></div>
  <div class="btn" id="bJump">ジャンプ</div>
  <div class="btn" id="bHit">叩く</div>
  <div class="btn" id="bAttack">攻撃<small>タッチ/破壊</small></div>
</div>

<div id="screen"></div>
<div id="wait"></div>
<div id="rotate"><div class="icon">📱</div>スマホを横にしてください</div>
<div id="loadErr">3D描画ライブラリ(Three.js)を読み込めませんでした。<br>インターネット接続を確認して再読み込みしてください。</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// =====================================================================
// 調整用の定数
// =====================================================================
const DAY_TIME = 90;          // 昼フェーズの長さ(秒)
const NIGHT_TIME = 120;       // 夜フェーズの長さ(秒)
const FREEZE_LIMIT = 30;      // 凍結してから脱落するまでの秒数
const MAX_FREEZE_COUNT = 3;   // この回数凍結した人は、次のタッチで即脱落
const HUMAN_COUNT = 6;        // 人の数
const ONI_COUNT = 2;          // 鬼の数
const FIELD_SIZE = 60;        // フィールドの大きさ(マス)

// ---- 部屋(STEP1は2部屋) ----
const ROOM_DEFS = [
  { id: 'forest',  name: '森',     icon: '🌲', desc: '木が多く見通しが悪い' },
  { id: 'factory', name: '廃工場', icon: '🏭', desc: '狭い通路と壁が多い' },
];
// ---- 鬼の強化(待機ルームで1つ選ぶ) ----
const BOOSTS = {
  speed:  { name: '移動速度アップ', desc: '足が1.2倍速くなる' },
  power:  { name: '破壊力アップ',   desc: '壁・足場へのダメージ2倍' },
  freeze: { name: '凍結時間延長',   desc: '凍らせた人の解凍に2倍の時間がかかる' },
};
const BOOST_SPEED = 1.2, BOOST_POWER = 2, BOOST_THAW = 2;

// ---- 資材(多め) ----
const BOX_COUNT = 130;        // 最初に置かれる箱の数
const BOX_ITEMS = 5;          // 箱1つから出る資材の数
const CHEST_ITEMS = 50;       // 巨大宝箱から出る資材の数
const RAIN_BOXES = 26;        // 資材の雨で降る箱の数
const START_WOOD = 4, START_STONE = 3;
const EVENT_INTERVAL = 30;    // 昼のランダムイベントの間隔(秒)

// ---- 建築 ----
const PARTS = {
  scaffold: { name: '足場', wood: 2, stone: 0, h: 1, hp: 4 },
  wall:     { name: '壁',   wood: 0, stone: 3, h: 2, hp: 8 },
};
const PART_ORDER = ['scaffold', 'wall'];
const MAX_STACK = 8;                 // 積める高さの上限
const SCAFFOLD_SAFE_TIME = 5;        // 同じ足場にこの秒数いると揺れ始める
const SCAFFOLD_CRUMBLE_TIME = 2;     // 揺れ始めてから崩れるまで
const BUILD_MODE_TIMEOUT = 6;        // 建築プレビューが消えるまでの秒数
const LONG_PRESS = 0.45;             // 長押し判定(秒)

// ---- キャラ ----
const GRAVITY = 22;
const HUMAN_SPEED = 4.2, HUMAN_JUMP = 1.3;  // ジャンプの高さ1.3 → 1段だけ登れる
const HUMAN_R = 0.3, HUMAN_H = 1.6;
const ONI = {
  carnivore: { name: '🐺 肉食動物', speed: 4.9, jump: 0.55, r: 0.42, h: 1.1, dmg: 1 },
  monster:   { name: '👹 モンスター', speed: 3.2, jump: 0.5,  r: 0.55, h: 2.7, dmg: 5 },
};
const HIGH_Y = 0.5;                  // この高さ以上が「高い場所」(高鬼のセーフ)
const MONSTER_REACH = 1.05;          // モンスターがタッチできる高さ
const THAW_TIME = 2, HIT_STUN = 2, HIT_COST = 35, STAMINA_MAX = 100, STAMINA_REGEN = 12, HIT_RANGE = 1.5;
const ONI_ATTACK_RANGE = 1.3, ONI_ATTACK_CD = 0.6;

// ---- 表示 ----
const CAM_DIST = 7.5, CAM_HEIGHT = 4.2, CAM_ROT_SPEED = 0.007;
const MAX_LANTERN_LIGHTS = 3;        // 実際に光らせるランタンの数(軽さ優先)
const SKY_DAY = 0x9ed6ff, SKY_NIGHT = 0x05070f;
const FOG_DAY = [35, 85], FOG_NIGHT = [4, 19];

const N = FIELD_SIZE, TAU = Math.PI * 2;
const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const HUMAN_COLORS = [0x3d8bfd, 0x20c997, 0xffc233, 0xf783ac, 0x9775fa, 0x66d9e8, 0xff922b, 0x94d82d];

// =====================================================================
// ユーティリティ
// =====================================================================
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hdist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const dir2 = (x, z) => { const l = Math.hypot(x, z); return l > 1e-6 ? { x: x / l, z: z / l } : { x: 0, z: 0 }; };
const fmtTime = (t) => { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const $ = (id) => document.getElementById(id);
const idx = (x, z) => z * N + x;
const inField = (x, z) => x >= 0 && z >= 0 && x < N && z < N;
const cellOf = (e) => idx(Math.floor(e.x), Math.floor(e.z));
const cX = (i) => (i % N) + 0.5, cZ = (i) => ((i / N) | 0) + 0.5;
function nearest(list, p, filter) {
  let best = null, bd = Infinity;
  for (const e of list) { if (filter && !filter(e)) continue; const d = hdist(e, p); if (d < bd) { bd = d; best = e; } }
  return best;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = randInt(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; }

if (typeof THREE === 'undefined') { $('loadErr').style.display = 'flex'; throw new Error('THREE not loaded'); }

// =====================================================================
// フィールド(グリッド)
// =====================================================================
// obst: 0=なし 1=柵 2=岩 3=木 4=小屋   cols: 各マスに積まれたブロック   heights: 各マスの高さ
const OB_FENCE = 1, OB_ROCK = 2, OB_TREE = 3, OB_HUT = 4, OB_DIV = 5, OB_FWALL = 6, OB_TANK = 7, OB_GATE = 8;
let obst = new Uint8Array(N * N), heights = new Float32Array(N * N), cols = [], huts = [];

// 部屋の区切り: 中央の2列が仕切り壁。通路は2か所
const DIV0 = (N >> 1) - 1, DIV1 = N >> 1;
const PASSAGES = [Math.round(N * 0.25), Math.round(N * 0.75)].map((c) => [c - 1, c, c + 1]);
let ROOMS = [];
function makeRooms() {
  ROOMS = ROOM_DEFS.map((d, k) => {
    const x0 = k === 0 ? 1 : DIV1 + 1, x1 = k === 0 ? DIV0 - 1 : N - 2, cx = Math.floor((x0 + x1) / 2);
    return Object.assign({}, d, { k, x0, x1, entrances: [{ x: cx, z: 3, name: '北' }, { x: cx, z: N - 4, name: '南' }] });
  });
}
const roomAt = (x) => (x <= DIV0 - 1 ? 0 : x >= DIV1 + 1 ? 1 : -1);
const isPassage = (x, z) => (x === DIV0 || x === DIV1) && PASSAGES.some((p) => p.includes(z));

function genField() {
  makeRooms();
  obst = new Uint8Array(N * N); heights = new Float32Array(N * N); cols = []; huts = [];
  for (let i = 0; i < N * N; i++) cols.push([]);
  for (let i = 0; i < N; i++) { obst[idx(i, 0)] = obst[idx(i, N - 1)] = obst[idx(0, i)] = obst[idx(N - 1, i)] = OB_FENCE; }
  for (let z = 1; z < N - 1; z++) for (const x of [DIV0, DIV1]) if (!isPassage(x, z)) obst[idx(x, z)] = OB_DIV;
  // 入口と通路の前は空けておく
  const reserved = (x, z) => ROOMS.some((r) => r.entrances.some((e) => Math.abs(e.x - x) <= 3 && Math.abs(e.z - z) <= 3)) ||
    PASSAGES.some((p) => Math.abs(x - (DIV0 + 0.5)) <= 4.5 && z >= p[0] - 1 && z <= p[2] + 1);
  const inRoom = (r, x, z) => x >= r.x0 && x <= r.x1 && z >= 1 && z <= N - 2;

  // ---- 森: 木が多く見通しが悪い ----
  const F = ROOMS[0];
  for (let tries = 0; huts.length < 2 && tries < 200; tries++) {
    const x = randInt(F.x0 + 1, F.x1 - 4), z = randInt(3, N - 6);
    let ok = true;
    for (let dz = -1; dz <= 3 && ok; dz++) for (let dx = -1; dx <= 3 && ok; dx++) if (obst[idx(x + dx, z + dz)] || reserved(x + dx, z + dz)) ok = false;
    if (!ok) continue;
    for (let dz = 0; dz < 3; dz++) for (let dx = 0; dx < 3; dx++) obst[idx(x + dx, z + dz)] = OB_HUT;
    huts.push({ x, z, rot: randInt(0, 3) });
  }
  for (let i = 0; i < 22; i++) {
    let x = randInt(F.x0, F.x1), z = randInt(2, N - 3);
    for (let k = 0, n = randInt(1, 3); k < n; k++) {
      if (inRoom(F, x, z) && !reserved(x, z) && !obst[idx(x, z)]) obst[idx(x, z)] = OB_ROCK;
      const d = DIRS4[randInt(0, 3)]; x += d[0]; z += d[1];
    }
  }
  for (let i = 0; i < 420; i++) {
    const x = randInt(F.x0, F.x1), z = randInt(1, N - 2);
    if (!reserved(x, z) && !obst[idx(x, z)]) obst[idx(x, z)] = OB_TREE;
  }

  // ---- 廃工場: 4×4の小部屋が並ぶ迷路(狭い通路と壁) ----
  const W = ROOMS[1], seg = new Map();
  const segOf = (key) => { if (!seg.has(key)) seg.set(key, { drop: Math.random() < 0.22, g: randInt(0, 2) }); return seg.get(key); };
  for (let z = 1; z < N - 1; z++) for (let x = W.x0; x <= W.x1; x++) {
    const lx = x - W.x0, lz = z - 1, vert = lx % 5 === 4, hor = lz % 5 === 4;
    if (!vert && !hor) continue;
    if (!(vert && hor)) {
      const sg = vert ? segOf('v' + lx + '_' + Math.floor(lz / 5)) : segOf('h' + lz + '_' + Math.floor(lx / 5));
      const p = vert ? lz % 5 : lx % 5;
      if (sg.drop || p === sg.g || p === sg.g + 1) continue; // 通り抜けられる隙間
    }
    if (!reserved(x, z)) obst[idx(x, z)] = OB_FWALL;
  }
  for (let i = 0; i < 26; i++) {
    const x = randInt(W.x0, W.x1), z = randInt(2, N - 3);
    if (!reserved(x, z) && !obst[idx(x, z)]) obst[idx(x, z)] = OB_TANK;
  }

  // 入口から行けない場所は埋める

    const arms = [addBox(parts, MAT.mons, 0.34, 1.15, 0.38, -0.79, 1.42, 0.05), addBox(parts, MAT.mons, 0.34, 1.15, 0.38, 0.79, 1.42, 0.05)];
    for (const sx of [-1, 1]) { const h = new THREE.Mesh(GEO.cone, MAT.horn); h.scale.set(0.12, 0.42, 0.12); h.position.set(sx * 0.27, 2.95, 0.02); h.rotation.z = -sx * 0.3; parts.add(h); }
    addBox(parts, MAT.dark, 0.5, 0.1, 0.05, 0, 2.24, 0.39);

// =====================================================================
// ゲーム状態
// =====================================================================
let G = null, scene_ = 'title', playerSide = 'human', playerOniType = 'carnivore';
let camYaw = 0, nightK = 0;
const playing = () => scene_ === 'day' || scene_ === 'night';

function makeHuman(i, isPlayer, x, z) {

    wood: START_WOOD, stone: START_STONE, stamina: STAMINA_MAX, state: 'ok', freezeTimer: 0, freezeCount: 0, thaw: 0,
    buildType: 'scaffold', standBlock: null, standTime: 0, swing: 0, mv: { x: 0, z: 0 }, ai: newAI(), safeFx: 0,
    mesh: makeHumanMesh(color, isPlayer), name: isPlayer ? 'あなた' : 'CPU' + i,

}
function makeOni(i, type, isPlayer, x, z) {

           fruits: 0, stun: 0, atkCd: 0, freezeCd: 0, swing: 0, mv: { x: 0, z: 0 }, ai: newAI(), mesh: makeOniMesh(type), walkT: 0 };
}
function newAI() {
  return { pathT: 0, pFrom: -1, pGoal: -1, pNext: -1, pBreak: false, qT: 0, qKey: '', qFrom: -1, q: null,
           wander: -1, wanderT: 0, buildT: rand(2, 5), queue: [], towers: 0, hitCd: 0, banCell: -1, banT: 0,
           fleeA: rand(0, TAU), lastX: 0, lastZ: 0, stuckT: 0, unstickT: 0, unstickA: 0 };
}

function spawnBox(i, big = false, y = 0) {
  const b = { x: cX(i) + rand(-0.15, 0.15), z: cZ(i) + rand(-0.15, 0.15), y, vy: 0, big, opened: false, rot: rand(0, TAU) };
  if (big) {
    const g = new THREE.Group();
    addBox(g, MAT.chest, 1.4, 0.8, 1.0, 0, 0.4, 0); addBox(g, MAT.gold, 1.45, 0.16, 1.05, 0, 0.72, 0);
    addBox(g, MAT.chest, 1.4, 0.32, 1.0, 0, 0.96, 0); addBox(g, MAT.gold, 0.22, 0.3, 0.08, 0, 0.62, 0.52);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 40, 10, 1, true), MAT.beam); beam.position.y = 20; g.add(beam);
    world.add(g); b.mesh = g; G.chest = b;
  }

}

function startGame() {
  genField();
  buildFieldMeshes();
  $('labels').innerHTML = '';
  G = { phase: 'day', timeLeft: DAY_TIME, dayElapsed: 0, nextEvent: EVENT_INTERVAL, humans: [], onis: [], boxes: [], items: [], fruits: [],
        blocks: [], parts: [], fx: [], chest: null, rain: null, player: null, spectate: null, buildMode: false, buildIdle: 0,
        stats: { freezes: 0, thaws: 0, hits: 0, built: 0 }, cam: new THREE.Vector3() };
  // 昼の人は北の通路の前(森側)からスタート。鬼は待機ルームにいてフィールドには出ない
  const sx = DIV0 - 3, sz = PASSAGES[0][1] + 0.5;
  for (let i = 0; i < HUMAN_COUNT; i++) {
    const a = (i / HUMAN_COUNT) * TAU;
    G.humans.push(makeHuman(i, playerSide === 'human' && i === 0, sx + Math.cos(a) * 1.6, sz + Math.sin(a) * 1.6));
  }
  for (let i = 0; i < ONI_COUNT; i++) {
    const type = playerSide === 'oni' ? (i === 0 ? playerOniType : playerOniType === 'carnivore' ? 'monster' : 'carnivore') : (i % 2 ? 'monster' : 'carnivore');
    const o = makeOni(i, type, playerSide === 'oni' && i === 0, 2, 2);
    o.mesh.g.visible = false;
    if (!o.isPlayer) { o.vote = randInt(0, ROOMS.length - 1); o.boost = Object.keys(BOOSTS)[randInt(0, 2)]; } // CPUはランダム
    else { o.vote = null; o.boost = null; }
    G.onis.push(o);
  }
  G.player = playerSide === 'human' ? G.humans[0] : G.onis[0];
  for (let i = 0; i < BOX_COUNT; i++) spawnBox(randomFreeCell(1));
  G.lastRoom = 0;
  camYaw = -Math.PI / 2; nightK = 0;
  setGates(false);
  G.cam.set(G.player.x, G.player.y + 1.2, G.player.z);
  scene_ = 'day';
  applyLighting();
  showScreen(null); setupHUD();
  if (playerSide === 'human') telop('☀ 昼: 森と廃工場で資材を集め、足場を積もう！', 'blue');
  else renderWait();
}

// 投票で部屋を決める(同数ならランダム)
function decideRoom() {
  const votes = ROOMS.map(() => 0);
  for (const o of G.onis) votes[o.vote]++;
  const max = Math.max(...votes), top = votes.map((v, k) => (v === max ? k : -1)).filter((k) => k >= 0);
  return top[randInt(0, top.length - 1)];
}
function setOniType(o, type) {
  if (o.type === type) return;
  world.remove(o.mesh.g);
  const d = ONI[type];
  o.type = type; o.r = d.r; o.hgt = d.h; o.jumpH = d.jump; o.mesh = makeOniMesh(type); o.mesh.g.visible = false;
}
// 入口の近くの空いているマスをランダムに選ぶ
function spotsNear(e, n) {
  const list = [];
  for (let rr = 1; rr <= 6 && list.length < n * 3; rr++) for (let z = e.z - rr; z <= e.z + rr; z++) for (let x = e.x - rr; x <= e.x + rr; x++) {
    if (!inField(x, z)) continue;
    const i = idx(x, z);
    if (!obst[i] && heights[i] === 0 && !list.includes(i)) list.push(i);
  }
  return shuffle(list).slice(0, n);
}

function startNight() {
  G.phase = 'night'; scene_ = 'night'; G.timeLeft = NIGHT_TIME;
  $('wait').style.display = 'none';
  // 選ばれていない項目はランダムで決める
  for (const o of G.onis) {
    if (o.vote === null) o.vote = randInt(0, ROOMS.length - 1);
    if (!o.boost) o.boost = Object.keys(BOOSTS)[randInt(0, 2)];
    o.speedMul = o.boost === 'speed' ? BOOST_SPEED : 1;
    o.dmgMul = o.boost === 'power' ? BOOST_POWER : 1;
    o.thawMul = o.boost === 'freeze' ? BOOST_THAW : 1;
  }
  const room = ROOMS[decideRoom()];
  G.room = room.k;
  setGates(true);
  // 人は入口の片方、鬼は反対側の入口から
  const hk = randInt(0, 1), he = room.entrances[hk], oe = room.entrances[1 - hk];
  const alive = G.humans.filter((h) => h.state !== 'out');
  spotsNear(he, alive.length).forEach((i, k) => { const h = alive[k]; h.x = cX(i); h.z = cZ(i); h.y = 0; h.vy = 0; h.ai = newAI(); });
  spotsNear(oe, G.onis.length).forEach((i, k) => { const o = G.onis[k]; o.x = cX(i); o.z = cZ(i); o.y = 0; o.vy = 0; o.ai = newAI(); o.mesh.g.visible = true; o.yaw = Math.atan2(he.x - oe.x, he.z - oe.z); });
  G.humanEntrance = he; G.oniEntrance = oe;
  // 人は鬼の入口の方を向く/カメラも合わせる
  const f = G.player;
  if (f.kind === 'human') { f.yaw = Math.atan2(oe.x - he.x, oe.z - he.z); camYaw = f.yaw + Math.PI; } else camYaw = f.yaw + Math.PI;
  G.cam.set(f.x, f.y + 1.2, f.z);
  G.buildMode = false;
  for (const f of G.fruits) world.remove(f.mesh);
  G.fruits = [];
  if (G.chest) { G.chest.mesh.children.forEach((m) => { if (m.material === MAT.beam) m.visible = false; }); }
  G.rain && world.remove(G.rain.mesh); G.rain = null;
  G.humans.forEach((h) => { h.ai.queue = []; h.standBlock = null; h.standTime = 0; });
  telop(`🌙 鬼が「${room.icon} ${room.name}」の部屋を選んだ！ 鬼は${oe.name}の入口から来る…`, '');
  setupHUD();
}

function endGame(winner) {
  scene_ = 'result';
  const alive = G.humans.filter((h) => h.state !== 'out').length, youWin = winner === playerSide;
  setupHUD(true);
  showScreen(`
    <div class="result-big ${youWin ? 'win' : 'lose'}">${youWin ? '🏆 勝利！' : '敗北…'}</div>
    <h2>${winner === 'human' ? '人チーム' : '鬼チーム'}の勝ち</h2>
    <div class="stats">生き残った人 <b>${alive} / ${HUMAN_COUNT}</b>　凍結 <b>${G.stats.freezes}</b>回　解凍 <b>${G.stats.thaws}</b>回<br>
      建てたブロック <b>${G.stats.built}</b>個　鬼を叩いた回数 <b>${G.stats.hits}</b></div>
    <div class="row2"><button class="choice c-human" data-act="again">もう一度遊ぶ</button><button class="choice c-plain" data-act="title">タイトルへ</button></div>
  `);
}

// ---------------------------------------------------------------------
// 昼のイベント
// ---------------------------------------------------------------------
function areaName(x, z) {
  const r = ROOMS[roomAt(x)] || ROOMS[0];
  return `${r.icon}${r.name}の` + ['北', '中央', '南'][z < N / 3 ? 0 : z < (N * 2) / 3 ? 1 : 2];
}
function triggerEvent() {
  if (Math.random() < 0.5 || G.chest) { // 宝箱が残っているときは雨
    const ci = randomFreeCell(8), cx = ci % N, cz = (ci / N) | 0, R = 6;
    for (let k = 0; k < RAIN_BOXES; k++) spawnBox(randomFreeCell(1, (x, z) => Math.hypot(x - cx, z - cz) <= R), false, rand(14, 34));
    const ring = new THREE.Mesh(new THREE.RingGeometry(R - 0.3, R, 48), MAT.ring);
    ring.rotation.x = -Math.PI / 2; ring.position.set(cx + 0.5, 0.05, cz + 0.5); world.add(ring);
    if (G.rain) world.remove(G.rain.mesh);
    G.rain = { mesh: ring, t: 8, x: cx + 0.5, z: cz + 0.5, r: R };
    telop(`📦 資材の雨！ ${areaName(cx, cz)}エリアに箱が降ってくる！`);
  } else {
    const ci = randomFreeCell(4);
    spawnBox(ci, true, 0);

// =====================================================================
// 建築
// =====================================================================
function frontCell(e) {
  const dx = Math.sin(e.yaw), dz = Math.cos(e.yaw);
  let sx = 0, sz = 0;
  if (Math.abs(dx) >= Math.abs(dz)) sx = Math.sign(dx); else sz = Math.sign(dz);
  const x = Math.floor(e.x) + sx, z = Math.floor(e.z) + sz;
  return inField(x, z) ? idx(x, z) : -1;
}
function canPlace(i, type) {
  if (i < 0 || obst[i] || isPassage(i % N, (i / N) | 0)) return false;
  const p = PARTS[type], base = heights[i];
  if (base + p.h > MAX_STACK) return false;
  const x = i % N, z = (i / N) | 0;
  for (const b of G.boxes) if (!b.opened && Math.floor(b.x) === x && Math.floor(b.z) === z) return false;
  for (const f of G.fruits) if (Math.floor(f.x) === x && Math.floor(f.z) === z) return false;
  for (const e of [...G.humans, ...G.onis]) { // キャラと重なる場所には置けない
    if (e.state === 'out' || (e.kind === 'oni' && G.phase === 'day')) continue;
    if (e.x + e.r <= x || e.x - e.r >= x + 1 || e.z + e.r <= z || e.z - e.r >= z + 1) continue;
    if (e.y < base + p.h && e.y + e.hgt > base) return false;
  }
  return true;
}
function placeBlock(h, i, type, silent) {
  const p = PARTS[type];
  if (h.wood < p.wood || h.stone < p.stone) { if (!silent) toast(`資材が足りない (${p.name}: ${costText(type)})`); return false; }
  if (!canPlace(i, type)) { if (!silent) toast('そこには置けない'); return false; }
  h.wood -= p.wood; h.stone -= p.stone;
  const col = cols[i], base = heights[i];
  const mesh = new THREE.Mesh(p.h === 2 ? GEO.box2 : GEO.box1, type === 'wall' ? MAT.wall : MAT.scaffold);
  const b = { type, i, h: p.h, hp: p.hp, maxHp: p.hp, base, visY: base + 0.6, vy: 0, crumble: -1, shake: 0, mesh };
  col.push(b); heights[i] = base + p.h;
  mesh.position.set(cX(i), b.visY + p.h / 2, cZ(i)); world.add(mesh);
  G.blocks.push(b); G.stats.built++;
  burst(cX(i), base + p.h, cZ(i), type === 'wall' ? 0xb8c0cc : 0xc98a4b, 8);
  // 積んだ場所にある資材は上に乗せる
  for (const it of G.items) if (Math.floor(it.x) === i % N && Math.floor(it.z) === ((i / N) | 0) && it.y < heights[i]) it.y = heights[i];
  return true;
}
function removeBlock(b) {
  const col = cols[b.i], k = col.indexOf(b);
  if (k < 0) return;
  col.splice(k, 1);
  world.remove(b.mesh);
  G.blocks.splice(G.blocks.indexOf(b), 1);
  let base = 0;
  for (const o of col) { o.base = base; base += o.h; } // 上に積まれていたブロックは落下する
  heights[b.i] = base;
  burst(cX(b.i), b.base + b.h / 2, cZ(b.i), b.type === 'wall' ? 0x9aa3ad : 0xb07a43, 16);
}
function damageBlock(b, dmg) {
  b.hp -= dmg; b.shake = 0.25;
  burst(cX(b.i), b.base + b.h / 2, cZ(b.i), b.type === 'wall' ? 0x9aa3ad : 0xb07a43, 6);
  if (b.hp <= 0) { addFx(cX(b.i), b.base + b.h + 0.4, cZ(b.i), 'バキッ!', '#fff'); removeBlock(b); }
}
// 鬼の高さにあるブロック(なければ一番下)を狙う
function attackCell(o, i) {
  const col = cols[i]; if (!col || !col.length) return false;
  const b = col.find((x) => x.base + x.h > o.y + 0.05) || col[col.length - 1];
  damageBlock(b, ONI[o.type].dmg * (o.dmgMul || 1));
  return true;
}
function costText(type) { const p = PARTS[type], a = []; if (p.wood) a.push(`木${p.wood}`); if (p.stone) a.push(`石${p.stone}`); return a.join('+'); }

// =====================================================================
// アクション
// =====================================================================
function jump(e) { if (e.onGround && !(e.stun > 0) && e.state !== 'frozen') { e.vy = Math.sqrt(2 * GRAVITY * e.jumpH); e.onGround = false; } }

function openBox(b) {
  if (b.opened || b.y > 0.01 + groundAt(b.x, b.z, 0.1)) return;
  b.opened = true;
  const n = b.big ? CHEST_ITEMS : BOX_ITEMS;
  for (let k = 0; k < n; k++) {
    const a = rand(0, TAU), sp = b.big ? rand(1.5, 5) : rand(1, 2.8);
    G.items.push({ x: b.x, z: b.z, y: b.y + 0.5, vx: Math.cos(a) * sp, vz: Math.sin(a) * sp, vy: rand(4, 7.5),
                   type: Math.random() < 0.58 ? 'wood' : 'stone', age: 0, magnet: null, rot: rand(0, TAU), spin: rand(-6, 6) });
  }
  burst(b.x, b.y + 0.4, b.z, b.big ? 0xffd34d : 0xe3a25a, b.big ? 30 : 10);
  if (b.mesh) world.remove(b.mesh);
  if (b === G.chest) G.chest = null;
}
function doPick(h) {
  let any = false;
  for (const b of G.boxes) if (!b.opened && hdist(b, h) < (b.big ? 2.2 : 1.6) && Math.abs(b.y - h.y) < 1.2) { openBox(b); any = true; }
  for (const it of G.items) if (hdist(it, h) < 3.5 && Math.abs(it.y - h.y) < 2.5) { it.magnet = h; it.age = Math.max(it.age, 0.4); any = true; }
  if (!any && h.isPlayer) toast('近くに箱や資材がない');
}
function doHit(h) {
  if (h.state !== 'ok') return;
  if (h.stamina < HIT_COST) { if (h.isPlayer) toast('スタミナが足りない'); return; }
  h.stamina -= HIT_COST; h.swing = 0.3;
  let hit = false;
  for (const o of G.onis) {
    const d = hdist(o, h);
    if (d > HIT_RANGE + o.r || Math.abs(o.y - h.y) > 1.6) continue;
    const dot = (Math.sin(h.yaw) * (o.x - h.x) + Math.cos(h.yaw) * (o.z - h.z)) / (d || 1);
    if (dot < 0.2 && d > h.r + o.r + 0.2) continue;
    o.stun = HIT_STUN; hit = true;
    addFx(o.x, o.y + o.hgt + 0.3, o.z, 'ゴンッ!', '#ffe066'); burst(o.x, o.y + o.hgt * 0.6, o.z, 0xffe066, 10);
  }
  if (hit) G.stats.hits++;
}
function canTouch(o, h) {
  if (o.type === 'carnivore') return h.y < HIGH_Y;     // 高鬼: 高い場所の人にはタッチできない
  return h.y <= MONSTER_REACH;                          // モンスターは高さ1まで届く
}
function tryFreeze(o, h) {
  if (G.phase !== 'night' || h.state !== 'ok' || o.stun > 0 || o.freezeCd > 0) return false;
  if (!canTouch(o, h)) {
    if (h.safeFx <= 0) { addFx(h.x, h.y + 2, h.z, 'セーフ!', '#7CFC9A'); h.safeFx = 1; }
    return false;
  }
  o.freezeCd = 0.8;
  if (h.freezeCount >= MAX_FREEZE_COUNT) { eliminate(h, '即脱落!'); return true; }
  h.freezeCount++; h.state = 'frozen'; h.freezeTimer = FREEZE_LIMIT; h.thaw = 0; G.stats.freezes++;
  h.thawNeed = THAW_TIME * (o.thawMul || 1);
  addFx(h.x, h.y + 2.1, h.z, '凍結!', '#9be7ff'); burst(h.x, h.y + 1, h.z, 0xc9f3ff, 16);
  if (h.isPlayer) { toast(`凍結！ 仲間に${h.thawNeed}秒触れてもらうと解凍`); G.buildMode = false; }
  return true;
}
function eliminate(h, text) {
  h.state = 'out'; h.mesh.g.visible = false; h.label.style.display = 'none';
  addFx(h.x, h.y + 2, h.z, text || '脱落…', '#ff8787'); burst(h.x, h.y + 1, h.z, 0xff8787, 20);
  if (h.isPlayer) { telop('あなたは脱落… 仲間を観戦中'); G.buildMode = false; }
}
function doOniAttack(o) {
  if (o.atkCd > 0 || o.stun > 0) return;
  o.atkCd = ONI_ATTACK_CD; o.swing = 0.3;
  const fx = Math.sin(o.yaw), fz = Math.cos(o.yaw);
  if (G.phase === 'night') {
    for (const h of G.humans) {
      if (h.state !== 'ok') continue;
      const d = hdist(h, o);
      if (d > ONI_ATTACK_RANGE + o.r + h.r) continue;
      const dot = (fx * (h.x - o.x) + fz * (h.z - o.z)) / (d || 1);
      if (dot < 0.25 && d > o.r + h.r + 0.2) continue;
      if (tryFreeze(o, h)) return;
    }
  }
  const i = frontCell(o);
  if (i < 0 || !cols[i].length) return;
  if (G.phase !== 'night') { if (o.isPlayer) toast('昼のあいだは建物を壊せない'); return; }
  attackCell(o, i);
}

// =====================================================================
// 演出(パーティクル・文字・テロップ)
// =====================================================================
function burst(x, y, z, color, n) {
  for (let k = 0; k < n && G.parts.length < 400; k++) {
    const a = rand(0, TAU), sp = rand(1, 4);

// =====================================================================
// 更新
// =====================================================================
function update(dt) {

    if (G.player.kind === 'oni') $('waitTime').textContent = '夜まで ' + fmtTime(G.timeLeft);
    else if (G.player.state === 'ok') { // 部屋に入ったら知らせる
      const r = roomAt(Math.floor(G.player.x));
      if (r >= 0 && r !== G.lastRoom) { G.lastRoom = r; toast(`${ROOMS[r].icon} ${ROOMS[r].name}に入った`); }
    }
    if (G.dayElapsed >= G.nextEvent && G.nextEvent < DAY_TIME) { triggerEvent(); G.nextEvent += EVENT_INTERVAL; }
    if (G.rain) { G.rain.t -= dt; if (G.rain.t <= 0) { world.remove(G.rain.mesh); G.rain = null; } }
    if (G.timeLeft <= 0) { startNight(); return; }
  } else if (G.timeLeft <= 0) { endGame(G.humans.some((h) => h.state !== 'out') ? 'human' : 'oni'); return; }

    if (buildPress.t >= LONG_PRESS) { buildPress.switched = true; switchPart(); $('buildRing').style.borderColor = 'transparent'; }
  }

  // --- 箱 ---
  for (const b of G.boxes) {

    b.y = g;
    for (const h of G.humans) if (h.state === 'ok' && hdist(h, b) < h.r + (b.big ? 0.8 : 0.4) && Math.abs(h.y - b.y) < 0.9) { openBox(b); break; }

    }

    for (const h of G.humans) {
      if (h.state === 'frozen') {
        const help = G.humans.some((a) => a !== h && a.state === 'ok' && hdist(a, h) < a.r + h.r + 0.35 && Math.abs(a.y - h.y) < 1.2);
        h.thaw = help ? h.thaw + dt : Math.max(0, h.thaw - dt * 0.5);
        if (h.thaw >= (h.thawNeed || THAW_TIME)) {
          h.state = 'ok'; h.thaw = 0; G.stats.thaws++;
          addFx(h.x, h.y + 2, h.z, '解凍!', '#7CFC9A'); burst(h.x, h.y + 1, h.z, 0x9bffc0, 14);
          if (h.isPlayer) toast('解凍された！');
          continue;
        }
        h.freezeTimer -= dt;
        if (h.freezeTimer <= 0) eliminate(h, '脱落…');
      } else if (h.state === 'ok') {
        // 高鬼: 同じ足場に乗り続けると揺れて崩れる
        const i = cellOf(h), col = cols[i], top = col[col.length - 1];
        if (h.onGround && top && top.type === 'scaffold' && Math.abs(h.y - heights[i]) < 0.05) {
          if (h.standBlock === top) h.standTime += dt; else { h.standBlock = top; h.standTime = 0; }
          if (h.standTime >= SCAFFOLD_SAFE_TIME && top.crumble < 0) { top.crumble = SCAFFOLD_CRUMBLE_TIME; addFx(h.x, h.y + 2, h.z, '足場がグラグラ!', '#ffd34d'); }
        } else if (h.onGround) { h.standBlock = null; h.standTime = 0; }
      }
    }
    if (G.humans.every((h) => h.state === 'out')) { endGame('oni'); return; }
  }

  // --- ブロック ---
  for (const b of G.blocks.slice()) {
    b.shake = Math.max(0, b.shake - dt);
    if (b.visY > b.base) { b.vy += GRAVITY * dt; b.visY = Math.max(b.base, b.visY - b.vy * dt); if (b.visY === b.base) b.vy = 0; }
    if (b.crumble >= 0) { b.crumble -= dt; if (b.crumble <= 0) removeBlock(b); }
  }

  // --- 演出 ---
  for (const p of G.parts) { p.t += dt; p.vy -= GRAVITY * 0.5 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; }
  G.parts = G.parts.filter((p) => p.t < p.life);
  for (const f of G.fx) f.t += dt;
  G.fx = G.fx.filter((f) => { if (f.t > 1.1) { f.el.remove(); return false; } return true; });

  // 昼夜の切り替え(3秒かけて暗くする)
  const target = G.phase === 'night' ? 1 : 0;
  if (nightK !== target) { nightK = clamp(nightK + (target ? dt : -dt) / 3, 0, 1); applyLighting(); }
}

function applyLighting() {
  const k = nightK;
  scene.background.set(SKY_DAY).lerp(_c.set(SKY_NIGHT), k);
  scene.fog.color.copy(scene.background);
  scene.fog.near = FOG_DAY[0] + (FOG_NIGHT[0] - FOG_DAY[0]) * k;
  scene.fog.far = FOG_DAY[1] + (FOG_NIGHT[1] - FOG_DAY[1]) * k;
  hemi.intensity = 0.9 - 0.6 * k; sun.intensity = 0.7 - 0.58 * k;
  hemi.color.set(0xe4f3ff).lerp(_c.set(0x8aa0ff), k);
  for (const l of lanternLights) l.intensity = 2.6 * k;
}

function syncVisuals(time) {
  // 人
  for (const h of G.humans) {
    const m = h.mesh;
    if (h.state === 'out') { m.g.visible = false; continue; }
    m.g.position.set(h.x, h.y, h.z); m.g.rotation.y = h.yaw;
    m.ice.visible = h.state === 'frozen';
    m.stick.visible = h.swing > 0; m.stick.rotation.y = h.swing > 0 ? (h.swing / 0.3 - 0.5) * 2.4 : 0;
    const bob = h.state === 'ok' && h.onGround && Math.hypot(h.mv.x, h.mv.z) > 0.1 ? Math.abs(Math.sin(time / 90)) * 0.06 : 0;
    m.g.position.y += bob;
  }
  // 鬼
  for (const o of G.onis) {
    const m = o.mesh;
    m.g.visible = G.phase === 'night';
    m.g.position.set(o.x, o.y, o.z); m.g.rotation.y = o.yaw;
    m.parts.rotation.x = o.swing > 0 ? Math.sin((o.swing / 0.3) * Math.PI) * 0.35 : 0;
    const legs = m.g.userData.legs, sw = Math.sin(o.walkT * 3) * 0.5;
    if (legs) legs.forEach((l, k) => (l.rotation.x = (k % 2 ? sw : -sw) * (k > 1 ? -1 : 1)));
    m.stars.visible = o.stun > 0; m.stars.rotation.y = time / 200;
  }
  // 箱
  let k = 0;
  for (const b of G.boxes) {
    if (b.big) { b.mesh.position.set(b.x, b.y, b.z); continue; }
    _m.compose(_v.set(b.x, b.y + 0.25, b.z), _q.setFromEuler(_e.set(0, b.rot, 0)), _s.set(1, 1, 1)); POOL.crate.setMatrixAt(k++, _m);
    if (k >= 600) break;
  }
  POOL.crate.count = k; POOL.crate.instanceMatrix.needsUpdate = true;
  // 資材
  let kw = 0, ks = 0;
  for (const it of G.items) {
    _m.compose(_v.set(it.x, it.y + 0.09, it.z), _q.setFromEuler(_e.set(0, it.rot, 0)), _s.set(1, 1, 1));
    if (it.type === 'wood') { if (kw < 2500) POOL.wood.setMatrixAt(kw++, _m); } else if (ks < 2500) POOL.stone.setMatrixAt(ks++, _m);
  }
  POOL.wood.count = kw; POOL.stone.count = ks; POOL.wood.instanceMatrix.needsUpdate = POOL.stone.instanceMatrix.needsUpdate = true;
  // 力の実
  for (const f of G.fruits) { f.mesh.position.set(f.x, f.y + Math.sin(f.bob) * 0.1, f.z); f.mesh.rotation.y = f.bob * 0.5; }
  // ブロック
  for (const b of G.blocks) {
    let ox = 0, oz = 0;
    if (b.shake > 0 || b.crumble >= 0) { const a = b.crumble >= 0 ? 0.07 : 0.05; ox = rand(-a, a); oz = rand(-a, a); }
    b.mesh.position.set(cX(b.i) + ox, b.visY + b.h / 2, cZ(b.i) + oz);
  }
  // パーティクル
  let kp = 0;
  for (const p of G.parts) {
    const s = 1 - p.t / p.life;
    _m.compose(_v.set(p.x, p.y, p.z), _q.identity(), _s.set(s, s, s)); POOL.part.setMatrixAt(kp, _m); POOL.part.setColorAt(kp, _c.set(p.color)); kp++;
  }
  POOL.part.count = kp; POOL.part.instanceMatrix.needsUpdate = true; if (POOL.part.instanceColor) POOL.part.instanceColor.needsUpdate = true;

  // 建築プレビュー
  const p = G.player;
  if (G.buildMode && p.kind === 'human' && p.state === 'ok') {
    const i = frontCell(p), part = PARTS[p.buildType], ok = canPlace(i, p.buildType);
    if (i >= 0) {
      G3.preview.visible = true; G3.preview.geometry = part.h === 2 ? GEO.box2 : GEO.box1;
      G3.preview.position.set(cX(i), (obst[i] ? 0 : heights[i]) + part.h / 2, cZ(i));
      MAT.preview.color.set(ok ? 0x7CFC9A : 0xff5a5a);
    } else G3.preview.visible = false;
  } else G3.preview.visible = false;
  $('bBuild').classList.toggle('on', !!G.buildMode);

  // カメラ(斜め後ろ上から追従)
  let focus = G.player;
  if (focus.kind === 'human' && focus.state === 'out') {
    if (!G.spectate || G.spectate.state === 'out') G.spectate = G.humans.find((h) => h.state !== 'out') || focus;
    focus = G.spectate;
  }
  G.cam.lerp(_v.set(focus.x, focus.y + 1.2, focus.z), 0.15);
  // 木や小屋にさえぎられたらカメラを近づける
  let f = 1;
  for (let k = 1; k <= 24; k++) {
    const t = k / 24, px = G.cam.x + Math.sin(camYaw) * CAM_DIST * t, pz = G.cam.z + Math.cos(camYaw) * CAM_DIST * t, py = G.cam.y + CAM_HEIGHT * t;
    if (obstHeightAt(px, pz) > py - 0.3) { f = Math.max(0.25, (k - 1.5) / 24); break; }
  }
  camDistK += (f - camDistK) * (f < camDistK ? 0.4 : 0.08);
  camera.position.set(G.cam.x + Math.sin(camYaw) * CAM_DIST * camDistK, G.cam.y + CAM_HEIGHT * camDistK, G.cam.z + Math.cos(camYaw) * CAM_DIST * camDistK);
  camera.lookAt(G.cam);

  // ランタンの光: カメラに近い人から順に割り当て
  if (nightK > 0) {
    const list = G.humans.filter((h) => h.state !== 'out').sort((a, b) => hdist(a, focus) - hdist(b, focus));
    lanternLights.forEach((l, k2) => {
      const h = list[k2];
      if (h) { h.mesh.lantern.getWorldPosition(l.position); l.visible = true; } else l.position.set(0, -50, 0);
    });
  }
  MAT.lantern.color.set(nightK > 0.3 ? 0xffe9a8 : 0xffd27a);
}

let camDistK = 1;
const OB_HEIGHT = { [OB_FENCE]: 1.2, [OB_ROCK]: 0.9, [OB_TREE]: 3.0, [OB_HUT]: 3.6, [OB_DIV]: 3.2, [OB_FWALL]: 2.6, [OB_TANK]: 2.2, [OB_GATE]: 2.4 };
function obstHeightAt(x, z) {
  const fx = Math.floor(x), fz = Math.floor(z);
  if (!inField(fx, fz)) return 0;
  const i = idx(fx, fz);
  return obst[i] ? OB_HEIGHT[obst[i]] : heights[i];
}

// 頭上の表示(凍結タイマー・文字)
function project(x, y, z) {
  _v.set(x, y, z).project(camera);
  if (_v.z > 1 || _v.z < -1) return null;
  return { x: (_v.x + 1) / 2 * innerWidth, y: (1 - _v.y) / 2 * innerHeight };
}
function updateLabels() {
  const focus = G.player.state === 'out' && G.spectate ? G.spectate : G.player;
  for (const h of G.humans) {
    if (h.state !== 'frozen' || hdist(h, focus) > (G.phase === 'night' ? 16 : 40)) { h.label.style.display = 'none'; continue; }
    const p = project(h.x, h.y + 2.2, h.z);
    if (!p) { h.label.style.display = 'none'; continue; }
    h.label.style.display = 'block';
    const t = Math.ceil(h.freezeTimer);
    h.label.innerHTML = `<span style="color:${t <= 10 ? '#ff8787' : '#bdefff'}">❄${t}</span><div class="tb"><div style="width:${(h.thaw / (h.thawNeed || THAW_TIME)) * 100}%"></div></div>`;
    h.label.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -100%)`;
  }
  for (const f of G.fx) {
    const p = project(f.x, f.y + f.t * 0.8, f.z);
    if (!p) { f.el.style.display = 'none'; continue; }
    f.el.style.display = 'block'; f.el.style.opacity = String(1 - f.t / 1.1);
    f.el.style.transform = `translate(${p.x}px, ${p.y}px) translate(-50%, -100%)`;
  }
}

let miniBase = null;
function renderMinimapBase() {
  miniBase = document.createElement('canvas'); miniBase.width = miniBase.height = N * 4;
  const c = miniBase.getContext('2d');
  c.fillStyle = '#4f8a45'; c.fillRect(0, 0, N * 4, N * 4);
  c.fillStyle = '#77787c'; c.fillRect((DIV1 + 1) * 4, 0, (N - DIV1 - 1) * 4, N * 4);
  const col = { [OB_FENCE]: '#8b5a2b', [OB_ROCK]: '#9aa1aa', [OB_TREE]: '#1f5e2a', [OB_HUT]: '#e8d6b0', [OB_DIV]: '#2a2c33', [OB_FWALL]: '#3e4249', [OB_TANK]: '#b5652b' };
  for (let i = 0; i < N * N; i++) if (obst[i]) { c.fillStyle = col[obst[i]]; c.fillRect((i % N) * 4, ((i / N) | 0) * 4, 4, 4); }
  c.font = 'bold 22px sans-serif'; c.textAlign = 'center'; c.fillStyle = 'rgba(255,255,255,.85)'; c.strokeStyle = 'rgba(0,0,0,.6)'; c.lineWidth = 4;
  for (const r of ROOMS) { const x = ((r.x0 + r.x1 + 1) / 2) * 4; c.strokeText(r.name, x, N * 2 + 8); c.fillText(r.name, x, N * 2 + 8); }
}
function drawMinimap(time) {
  const cv = $('minimap'), W = cv.width, s = W / N, c = cv.getContext('2d');
  c.drawImage(miniBase, 0, 0, W, W);
  if (nightK > 0) {
    c.fillStyle = `rgba(5,10,30,${0.55 * nightK})`; c.fillRect(0, 0, W, W);
    if (G.room !== undefined) { const r = ROOMS[1 - G.room]; c.fillStyle = 'rgba(0,0,0,.6)'; c.fillRect(r.x0 * s, 0, (r.x1 - r.x0 + 1) * s, W); }
  }
  for (const b of G.blocks) if (b === cols[b.i][cols[b.i].length - 1]) {
    c.fillStyle = b.type === 'wall' ? '#e2e6ea' : `hsl(30, 60%, ${35 + Math.min(heights[b.i], 6) * 6}%)`;
    c.fillRect((b.i % N) * s, ((b.i / N) | 0) * s, s, s);
  }
  const dot = (x, z, r, col) => { c.fillStyle = col; c.beginPath(); c.arc(x * s, z * s, r, 0, TAU); c.fill(); };
  const u = W / 120;
  if (G.phase === 'day') {
    for (const b of G.boxes) if (!b.big) dot(b.x, b.z, 1.2 * u, '#f0a050');
    if (G.player.kind === 'oni') for (const f of G.fruits) dot(f.x, f.z, 1.8 * u, '#ff4d4d');
  }
  if (G.chest && Math.sin(time / 150) > -0.3) dot(G.chest.x, G.chest.z, 4 * u, '#ffd34d');
  if (G.rain) { c.strokeStyle = '#ffd34d'; c.lineWidth = 1.5 * u; c.beginPath(); c.arc(G.rain.x * s, G.rain.z * s, G.rain.r * s, 0, TAU); c.stroke(); }
  for (const h of G.humans) if (h.state !== 'out') dot(h.x, h.z, (h.isPlayer ? 3.2 : 2.4) * u, h.state === 'frozen' ? '#bdefff' : h.isPlayer ? '#fff' : '#4d9bff');
  if (G.phase === 'night') for (const o of G.onis) dot(o.x, o.z, (o.isPlayer ? 3.4 : 2.8) * u, o.isPlayer ? '#fff' : '#ff3b3b');
  // カメラの向き
  const p = G.player.state === 'out' && G.spectate ? G.spectate : G.player;
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 1.5 * u; c.beginPath();
  c.moveTo(p.x * s, p.z * s); c.lineTo((p.x + fx * 6) * s, (p.z + fz * 6) * s); c.stroke();
}

      <button class="choice c-mons" data-act="monster">👹 モンスター<span>大きくて遅い。壁・足場を1〜2回で壊す。<br>高さ1までの人にタッチできる</span></button>
    </div>
    <button class="choice c-plain" data-act="back">← もどる</button>`);
}
$('screen').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'), act = b ? b.dataset.act : '';
  if (scene_ === 'title') { tryFullscreen(); showSide(); return; }
  if (act === 'human') { playerSide = 'human'; startGame(); }
  else if (act === 'oni') { playerSide = 'oni'; startGame(); } // 鬼の種類は待機ルームで選ぶ
  else if (act === 'carnivore' || act === 'monster') { playerOniType = act; startGame(); }
  else if (act === 'back' || act === 'again') showSide();
  else if (act === 'title') showTitle();
});
function tryFullscreen() {
  try {
    const el = document.documentElement, p = el.requestFullscreen && el.requestFullscreen({ navigationUI: 'hide' });
    if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
  } catch (_) {}
}

// =====================================================================
// 画面サイズ・向き
// =====================================================================
let portrait = false;
function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  portrait = innerHeight > innerWidth;
  $('rotate').style.display = portrait ? 'flex' : 'none';
  if (playing()) resetJoy();
}

// ズーム・スクロール・長押しメニューを無効化
['gesturestart', 'gesturechange', 'dblclick', 'contextmenu', 'selectstart'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', (e) => { if (e.touches.length > 1 && !e.target.closest('.btn')) e.preventDefault(); }, { passive: false });

// =====================================================================
// 起動・メインループ
// =====================================================================
init3D();
const cv = renderer.domElement;
cv.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
window.addEventListener('resize', onResize);
onResize();
showTitle();

let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  try {
    if (G && playing() && !portrait) update(dt);
    if (G && (playing() || scene_ === 'result')) {
      syncVisuals(t);
      renderer.render(scene, camera);
      if (playing()) { updateHUD(); updateLabels(); drawMinimap(t); }
    } else {
      renderer.setClearColor(0x0d1320); renderer.clear();
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
